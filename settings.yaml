                  label: Iconify 图标
                  help: 从 Iconify 图标库中选择社交媒体图标
                  format: svg # svg / dataurl / url / name
                - $formkit: text
                  name: name
                  label: 名称
                  placeholder: 例如 GitHub / 微博
                  help: 鼠标悬停时显示的名称
                  validation: "required"
                - $formkit: text
                  name: url
                  label: 链接
                  placeholder: 例如 https://github.com/username
                  help: 点击图标后跳转的地址
                  validation: "required"
        - $formkit: menuRadio
          name: menu
          label: 相关链接
          help: 默认只有主菜单，可前往【外观】—>【菜单】新建菜单组
        - $formkit: group
          name: footer_group
          label: 页脚友链
          value:
            enable_footer_group: true
            num: 3
          children:
            - $formkit: switch
              name: enable_footer_group
              id: enable_footer_group
              key: enable_footer_group
              label: 开启页脚友链
              help: 在页脚显示友情链接分组，展示指定数量的友链站点
            - $formkit: number
              if: $get(enable_footer_group).value
              name: num
              label: 友链显示数量
              validation: required
              help: 页脚友链每组显示的站点数量
              min: 1
              key: footer_footer_group_num
              placeholder: 例如：3
        - $formkit: group
          name: footerContent
          label: 页脚内容
          value:
            default_enable_group:
              default_enable: true
              dingyue: true
              zhuti: true
              about: true
              icp_icon: true
              gongwangan: true
              yingsi: true
              yunzhichi: false
              footer_banner_padding: 1
            style_one:
              owner_enable: false
              runtime_enable: true
              work_img: "/upload/%E5%9B%B0%E5%9B%B0%E9%B1%BC-%E4%B8%8B%E7%8F%AD%E5%95%A6-yellowgreen.svg"
              work_description: "距离月入25k也就还差一个大佬带我~"
              offduty_img: "/upload/%E5%9B%B0%E5%9B%B0%E9%B1%BC-%E4%B8%8B%E7%8F%AD%E5%95%A6-yellowgreen.svg"
              offduty_description: "下班了就该开开心心的玩耍，嘿嘿~"
              bdageitem_enable: false
              bdageitem:
                - link: "https://halo.run/"
                  shields: "https://npm.onmicrosoft.cn/hao-theme-static@1.3.6/images/Frame-Halo-blue.svg"
                  message: "博客框架为halo2.x"
