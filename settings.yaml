                  help: 鼠标悬停时显示的名称
                  validation: "required"
                - $formkit: text
                  name: url
                  label: 链接
                  placeholder: 例如 https://github.com/username
                  help: 点击图标后跳转的地址
                  validation: "required"
            - $formkit: array
              name: socialMediaRight
              label: 右侧社交媒体
              help: 页脚 Logo 右侧的社交媒体图标列表
              value: []
              itemLabels:
                - type: text
                  label: $value.name
                - type: text
                  label: $value.url
              children:
                - $formkit: toggle
                  name: option_social_data
                  label: 图标类型
                  value: icon
                  help: 选择手动填写图标代码，或使用 Iconify 选择器
                  render-type: text
                  size: 72
                  gap: 8
                  options:
                    - value: icon
                      label: 自定义代码
                      render: 代码
                    - value: custom
                      label: Iconify
                      render: Iconify
                - $formkit: textarea
                  if: $value.option_social_data == 'icon'
                  name: icon
                  key: icon
                  help: 可填写 SVG 代码、iconfont class，或完整的 img 标签
                  label: 图标
                  placeholder: 例如 <svg>...</svg> 或完整 img 标签
                  validation: "required"
                - $formkit: iconify
                  if: $value.option_social_data == 'custom'
