apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-hao-setting
spec:
  forms:
    - group: basics
      label: 01 · 基础与 SEO
      formSchema:
        - $formkit: code
          name: siteTitle
          label: 站点名称
          placeholder: 请输入站点名称
          height: 80px
          language: html
          help: 支持 HTML 语法
        - $formkit: date
          name: siteStartTime
          label: 建站时间
          validation: required
          value: "2023-08-05"
          help: 站点创建日期，用于页脚显示运行时间，此项为必填项
        - $formkit: text
          name: icp
          label: ICP 备案
          placeholder: 例如：皖ICP备 12345678 号
          help: 工信部备案号，不备案可留空。格式：皖ICP备 xxxxxxxx 号
        - $formkit: text
          name: gongan
          label: 公安备案
          placeholder: 例如：皖公网安备 12345678 号
          help: 公安部备案号，不备案可留空。格式：皖公网安备 xxxxxxxx 号
        - $formkit: url
          name: copyrightAgreement
          label: 版权协议
          placeholder: 例如：https://creativecommons.org/licenses/by-nc-nd/4.0/
          help: 文章版权声明中的协议链接，文章模块声明版权时也会使用此协议
        - $formkit: group
          name: seo
          label: SEO 设置
          value:
            keywords: ""
            description: ""
          children:
            - $formkit: textarea
              name: keywords
              label: 站点关键词
              placeholder: "多个关键词用英文逗号分隔，如：AI Agent,开源项目,GitHub Trending,开发工具,技术博客"
              help: "设置 meta keywords，有助于搜索引擎理解站点主题"
            - $formkit: textarea
              name: description
              label: 站点描述
              placeholder: "建议 150-220 个字符，简要描述站点内容与特色"
              help: "设置 meta description，建议长度 150-220 个字符（包括空格）。如未填写，将自动使用站点副标题"

    - group: nav
      label: 02 · 导航栏
      formSchema:
        - $formkit: group
          name: menus
          label: 菜单控制
          value:
            pc_leftMenu: true
            phone_leftMenu: true
            phone_menu: true
            enable_ali_iconfont_symbol_header: false
          children:
            - $formkit: switch
              name: pc_leftMenu
              id: pc_leftMenu
              label: PC 端左侧菜单
              help: 在导航栏左侧显示菜单组，可在「外观 → 菜单」中配置
            - $formkit: switch
              name: phone_leftMenu
              label: 移动端左侧菜单
              help: 在移动端导航栏左侧显示菜单按钮
            - $formkit: switch
              name: phone_menu
              label: 移动端主菜单
              help: 在移动端导航栏显示主菜单按钮
            - $formkit: switch
              name: enable_ali_iconfont_symbol_header
              label: 阿里巴巴 IconFont Symbol
              help: '开启后，可以使用阿里 IconFont 的 Symbol 彩色图标。语法为 #icon-xxx，例如 #icon-shouye'
        - $formkit: menuRadio
          name: leftMenu
          key: leftMenu
          id: leftMenu
          if: $get(pc_leftMenu).value
          label: 站点名左侧菜单
          help: 默认只有主菜单，可前往【外观】—>【菜单】新建菜单组
          value: ""
        - $formkit: group
          name: right
          label: 导航栏右侧
          value:
            travelling: true
            article: true
            darkMode: true
            navLogin: false
            console:
              consoleEnable: true
          children:
            - $formkit: switch
              name: travelling
              id: travelling
              key: travelling
              label: 开往按钮
              help: 导航栏右侧的开往项目按钮，点击随机前往一个开往成员站点
            - $formkit: switch
              name: article
              label: 随机文章
              help: 右上角随机文章按钮，点击随机跳转到一篇文章
            - $formkit: switch
              name: darkMode
              label: 切换模式
              help: 右上角暗色/亮色模式切换按钮
            - $formkit: switch
              name: navLogin
              label: 登入按钮
              help: 右上角用户登录按钮，需要 Halo 开启登录功能
            - $formkit: group
              name: console
              label: 中控台
              children:
                - $formkit: switch
                  name: consoleEnable
                  help: 右上角中控台按钮，可快速切换暗色模式、开关边栏和弹幕

                  label: 中控台按钮
    - group: top
      label: 03 · 首页首屏与 Banner
      formSchema:
        - $formkit: group
          name: above
          label: 首页第一屏
          help: 开启后会在页面的最上方新增一个第一屏
          value:
            enable_above: false
            typed:
            enable_typed_random:
            enable_above_video:
            index_img:
            phone_index_img:
            index_video:
          children:
            - $formkit: switch
              name: enable_above
              key: enable_above
              id: enable_above
              label: 启用第一屏
              help: 开启后在首页最上方显示全屏背景图和打字机效果
            - $formkit: array
              name: typed
              key: typed
              id: typed
              if: $get(enable_above).value
              label: 打字机显示的文字
              help: 第一屏打字机轮播的文案，建议 3-6 条短句
              value: []
              children:
                - $formkit: text
                  name: text
                  label: 轮播文案
                  placeholder: 例如：分享设计与科技生活
                  help: 打字机轮播的一条短句，建议 3-6 条、每条 15 字以内
              itemLabels:
                - type: text
                  label: $value.text
            - $formkit: switch
              label: 随机文字
              if: $get(enable_above).value
              name: enable_typed_random
              key: enable_typed_random
              id: enable_typed_random
              value: false
              help: 如果配置了自定义文字，优先展示自定义文字
            - $formkit: switch
              if: $get(enable_above).value
              label: 使用视频背景
              name: enable_above_video
              key: enable_above_video
              id: enable_above_video
              value: false
              help: 开启后第一屏使用动态视频壁纸，关闭则使用下方设置的静态背景图
            - $formkit: attachment
              name: index_video
              key: index_video
              id: index_video
              if: $get(enable_above).value  &&  $get(enable_above_video).value
              label: 动态壁纸
              placeholder: 请填写动态壁纸地址
              value: ""
              help: 第一屏视频背景，mp4 格式；移动端流量较大时建议仍用静态图
              width: 15rem
              aspectRatio: 16/9
            - $formkit: attachment
              name: index_img
              key: index_img
              id: index_img
              if: $get(enable_above).value  &&  $get(enable_above_video).value == false
              label: PC背景图
              help: 第一屏桌面端背景，建议 1920x1080 以上横图
              width: "15rem"
              aspectRatio: "16/9"
              placeholder: 请填写背景图地址
              value: https://www.dmoe.cc/random.php
            - $formkit: attachment
              name: phone_index_img
              key: phone_index_img
              id: phone_index_img
              if: $get(enable_above).value  &&  $get(enable_above_video).value == false
              label: 移动端背景图
              help: 第一屏移动端背景，建议 1080x1920 竖图
              placeholder: 请填写移动端背景图地址
              width: "15rem"
              aspectRatio: "16/9"
              value: https://imgapi.kouseki.cn/random?sort=mp
        - $formkit: group
          name: global_background
          label: 全局背景设置
          help: 开启后设置全局背景图片/视频
          value:
            enable_global_background_img: false
            index_background_img:
          children:
            - $formkit: switch
              label: 全局透明背景图
              name: enable_global_background_img
              key: enable_global_background_img
              id: enable_global_background_img
              value: false
              help: 首页透明背景图
            - $formkit: switch
              if: $get(enable_global_background_img).value
              label: 使用视频背景
              name: enable_global_background_above_video
              key: enable_global_background_above_video
              id: enable_global_background_above_video
              value: false
              help: 开启后全局背景使用动态视频，关闭则使用下方设置的静态背景图
            - $formkit: attachment
              name: global_background_img
              key: global_background_img
              id: global_background_img
              if: $get(enable_global_background_img).value  &&  $get(enable_global_background_above_video).value == false
              label: 全局背景图
              width: "15rem"
              aspectRatio: "16/9"
              placeholder: 请填写全局背景图片地址
              help: 全站通用背景，建议高斯模糊友好的大图
            - $formkit: attachment
              name: global_background_video
              id: global_background_video
              key: global_background_video
              if: $get(enable_global_background_img).value  &&  $get(enable_global_background_above_video).value
              label: 全局背景视频
              width: "15rem"
              aspectRatio: "16/9"
              placeholder: 请填写全局背景视频地址
              help: mp4 格式，建议 10MB 以内并开启 CDN
        - $formkit: switch
          name: moment
          label: 瞬间说说
          value: true
          help: 在首页顶部显示瞬间说说模块，需要安装 Halo 瞬间插件
        - $formkit: group
          name: climb
          label: 宠物挂件
          help: 在页面边缘显示攀爬动画图片，需要开启顶部 Banner
          value:
            climbEnable: false
            climbImg: https://imgapi.yyds.pink/random?sort=animals
          children:
            - $formkit: switch
              name: climbEnable
              key: climbEnable
              id: climbEnable
              label: 启用宠物挂件
              help: 在页面边缘显示攀爬动画，适合配合顶部 Banner 使用
            - $formkit: url
              name: climbImg
              key: climbImg
              id: climbImg
              if: $get(climbEnable).value
              label: 挂件图片
              placeholder: 请输入图片地址，例如 https://imgapi.yyds.pink/random?sort=animals
              help: 随机图地址：https://imgapi.yyds.pink/random?sort=animals
        - $formkit: switch
          name: recentTop
          id: recentTop
          key: recentTop
          label: 顶部 Banner
          value: true
          help: 首页顶部的推荐文章区域，包含左侧标题分类入口和右侧推荐文章
        - $formkit: group
          name: homeCenter
          label: 首页中心轮播
          help: 开启后替换默认顶部 Banner，适合展示 3-6 篇重点文章
          key: homeCenter
          id: homeCenter
          if: $get(recentTop).value
          value:
            enable: false
            tagText: 全站推荐
            autoPlay: true
            autoPlayInterval: 5000
            desktopHeight: 290
            mobileHeight: 220
            items: []
          children:
            - $formkit: switch
              name: enable
              id: homeCenterEnable
              key: homeCenterEnable
              label: 启用首页中心轮播
              help: 开启后将替换默认顶部 Banner 区域
            - $formkit: text
              name: tagText
              label: 推荐角标文案
              value: 全站推荐
              placeholder: 例如：全站推荐
              help: 轮播区左上角的小标签文字
            - $formkit: switch
              name: autoPlay
              label: 自动轮播
              value: true
              help: 开启后轮播图自动切换，关闭则需手动点击
            - $formkit: number
              name: autoPlayInterval
              label: 轮播间隔(ms)
              value: 5000
              min: 2000
              step: 500
              help: 自动轮播的时间间隔，单位毫秒，建议 4000-6000
              placeholder: 例如：5000
            - $formkit: number
              name: desktopHeight
              label: 桌面端高度(px)
              value: 290
              min: 220
              step: 10
              help: 桌面端轮播区高度，单位 px
              placeholder: 例如：290
            - $formkit: number
              name: mobileHeight
              label: 移动端高度(px)
              value: 220
              min: 180
              step: 10
              help: 移动端轮播区高度，单位 px
              placeholder: 例如：220
            - $formkit: array
              name: items
              label: 轮播项目
              help: 建议配置 3-6 项，主题色请使用 6 位十六进制颜色
              min: 1
              max: 6
              value: []
              itemLabels:
                - type: text
                  label: $value.post
              children:
                - $formkit: postSelect
                  name: post
                  label: 文章
                  value: ""
                  validation: required
                - $formkit: attachment
                  name: cover
                  label: 封面覆盖图
                  placeholder: 留空则使用文章封面
                  width: "15rem"
                  aspectRatio: "16/9"
                  help: 留空则使用所选文章的封面
                - $formkit: attachment
                  name: icon
                  label: 右侧小图标
                  placeholder: 留空则使用主图
                  width: "8rem"
                  aspectRatio: "1/1"
                  help: 留空则使用封面图，建议正方形小图
                - $formkit: color
                  name: themeColor
                  label: 卡片主题色
                  value: "#425AEF"
                  help: 轮播卡片的渐变主色，建议与站点主色呼应
                - $formkit: color
                  name: selectedBgColor
                  label: 选中项背景色
                  value: "#6f63f6"
                  help: 右侧列表选中态的背景色
        - $formkit: group
          name: BannerLeft
          label: Banner 左侧
          help: 首页 Banner 左侧的大标题与分类入口区
          key: BannerLeft
          id: BannerLeft
          if: $get(recentTop).value
          value:
            bannersBackgroundRollStyle: tags-group-all
            bannersBackground: default
            bannersTitleBig: <div class="banners-title-big">Halo Theme</div><div class="banners-title-big">Hao</div>
            bannersTitleSmall: 更多信息请关注 GitHub
            categoryGroup:
              - title: "必看"
                icon: "haofont hao-icon-book"
                url: "/"
                colorOneLight: "#358bff"
                colorTwoLight: "#15c6ff"
                colorOneDark: "#0653b8"
                colorTwoDark: "#2fcbff"
              - title: "热门"
                icon: "haofont hao-icon-fire"
                url: "/"
                colorOneLight: "#ff6655"
                colorTwoLight: "#ffbf37"
                colorOneDark: "#e22a16"
                colorTwoDark: "#da980c"
            techStack:
          children:
            - $formkit: toggle
              name: bannersBackground
              id: bannersBackground
              key: bannersBackground
              label: 左侧背景模式
              options:
                - label: 默认技术栈
                  value: default
                  render: 默认技术栈
                - label: 个人技术栈
                  value: techStack
                  render: 个人技术栈
              render-type: text
              size: 96
              gap: 10
              help: 默认显示技术栈图标云，选择个人技术栈后可在下方自定义图标
            - $formkit: array
              name: techStack
              key: techStack
              id: techStack
              if: $get(bannersBackground).value == 'techStack'
              label: 个人技术栈
              help: 需要先在上方背景图中选择“个人技术栈”，建议 4-8 个图标
              value: []
              itemLabels:
                - type: text
                  label: $value.name
                - type: text
                  label: $value.url
              children:
                - $formkit: text
                  name: name
                  label: 技术名称
                  placeholder: 例如：Vue / Docker
                  help: 图标下方或悬停显示的名称
                - $formkit: attachment
                  name: url
                  label: 技术图标
                  placeholder: 请输入图标路径
                  help: 技术栈图标图片，建议正方形透明底
                  width: 8rem
                  aspectRatio: 1/1
                - $formkit: color
                  name: background
                  label: 图标底色
                  help: 图标卡片的背景色，用于区分不同技术
            - $formkit: code
              name: bannersTitleBig
              label: 大标题
              placeholder: 请输入大标题
              height: 80px
              language: html
              help: 支持 HTML 语法  <div class="banners-title-big">内容</div>
            - $formkit: code
              name: bannersTitleSmall
              label: 小标题
              placeholder: 请输入小标题
              height: 80px
              language: html
              help: 支持 HTML 语法
            - $formkit: array
              name: categoryGroup
              id: categoryGroup
              key: categoryGroup
              min: 0
              max: 2
              itemLabels:
                - type: text
                  label: $value.title
                - type: text
                  label: $value.url
              children:
                - $formkit: text
                  name: title
                  label: 入口标题
                  placeholder: 例如：必看精选
                  validation: required
                  value: "必看精选"
                  help: Banner 左侧分类入口的标题，最多配置 2 个
                - $formkit: text
                  name: icon
                  label: 入口图标
                  placeholder: 例如：haofont hao-icon-book
                  validation: required
                  value: "haofont hao-icon-book"
                  help: '支持 haofont 类名，开启 IconFont Symbol 后也支持 #icon-xxx'
                - $formkit: url
                  name: url
                  label: 入口跳转链接
                  placeholder: 例如：/categories/必看
                  validation: required
                  value: "/"
                  help: 点击分类入口后跳转的地址
                - $formkit: color
                  name: colorOneLight
                  label: 颜色1 (浅色)
                  validation: required
                  value: "#358bff"
                  help: 浅色模式渐变起始色
                - $formkit: color
                  name: colorTwoLight
                  label: 颜色2 (浅色)
                  validation: required
                  value: "#15c6ff"
                  help: 浅色模式渐变结束色
                - $formkit: color
                  name: colorOneDark
                  label: 颜色1 (深色)
                  validation: required
                  value: "#0653b8"
                  help: 深色模式渐变起始色
                - $formkit: color
                  name: colorTwoDark
                  label: 颜色2 (深色)
                  validation: required
                  value: "#2fcbff"
                  help: 深色模式渐变结束色
        - $formkit: group
          name: BannerRight
          label: Banner 右侧
          help: 首页 Banner 右侧的今日推荐与推荐文章区
          key: BannerRight
          id: BannerRight
          if: $get(recentTop).value
          value:
            todayRecommend: true
            todayRecommendContent:
              todayRecommendUrl: /
              todayRecommendTitle: Halo-Theme-Hao
              todayRecommendCover: https://liuzhihang.com/upload/hao_dark.jpg
              todayRecommendxTitle: 今日推荐
            recommendPost: latest
          children:
            - $formkit: switch
              name: todayRecommend
              id: todayRecommend
              key: todayRecommend
              label: 今日推荐
              help: 开启后会在推荐文章前显示“今日推荐”模块
            - $formkit: group
              name: todayRecommendContent
              key: todayRecommendContent
              id: todayRecommendContent
              if: $get(todayRecommend).value
              label: 今日推荐内容
              help: 今日推荐卡片的跳转、标题与封面
              value:
                todayRecommendUrl:
                todayRecommendTitle:
                todayRecommendCover:
                todayRecommendxTitle:
              children:
                - $formkit: url
                  name: todayRecommendUrl
                  label: 今日推荐跳转链接
                  placeholder: 例如：/posts/xxx
                  value: /
                  help: 点击今日推荐卡片后跳转的文章地址
                - $formkit: text
                  name: todayRecommendxTitle
                  label: 今日推荐小标题
                  placeholder: 例如：今日推荐
                  value: 今日推荐
                  help: 卡片左上角的小字标签
                - $formkit: text
                  name: todayRecommendTitle
                  label: 今日推荐大标题
                  placeholder: 例如：Halo-Theme-Hao 上手指南
                  value: Halo-Theme-Hao
                  help: 卡片主标题，建议 10 字以内
                - $formkit: attachment
                  name: todayRecommendCover
                  label: 今日推荐封面
                  placeholder: 请输入地址
                  value: https://liuzhihang.com/upload/hao_dark.jpg
                  width: "15rem"
                  aspectRatio: "16/9"
                  help: 推荐卡片的背景图，建议 16:9 横图
            - $formkit: toggle
              name: recommendPost
              id: recommendPost
              key: recommendPost
              label: 右侧推荐来源
              value: latest
              options:
                - label: 最新文章
                  value: latest
                  render: 最新文章
                - label: 自定义
                  value: custom
                  render: 自定义
              render-type: text
              size: 72
              gap: 10
              help: 最新文章自动取站点最新发布，选择自定义可手动挑选 6 篇
            - $formkit: array
              key: recommendPostCustom
              id: recommendPostCustom
              if: $get(recommendPost).value === 'custom'
              name: recommendPostCustom
              label: 自定义文章
              help: 建议设置六篇文章
              max: 6
              children:
                - $formkit: postSelect
                  name: post
                  label: 文章
                  value: ""
                  validation: required

              itemLabels:
                - type: text
                  label: $value.post
    - group: layout
      label: 04 · 首页布局
      formSchema:
        - $formkit: group
          name: navs
          label: 文章导航
          help: 首页文章列表上方的分类 / 标签快捷导航条
          value:
            nav: category
            navCustomCategory:
            navCustomTag:
            navCustomUrl:
            navMore:
            navMoreCustomUrl:
          children:
            - $formkit: select
              name: nav
              id: nav
