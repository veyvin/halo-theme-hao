    - group: comments
      label: 评论
      formSchema:
        - $formkit: switch
          name: commentsEnable
          id: commentsEnable
          key: commentsEnable
          label: 开启评论
          value: true
          help: 开启文章和页面的评论功能，可在下方选择评论系统
        - $formkit: select
          name: use
          label: 评论系统
          id: use
          key: use
          if: $get(commentsEnable).value
          value: commentWidget
          help: 选择评论系统，支持默认、Twikoo、Artalk 和 Waline
          options:
            - label: 默认
              value: commentWidget
            - label: Twikoo
              value: Twikoo
            - label: Artalk
              value: Artalk
            - label: Waline
              value: Waline
        - $formkit: switch
          if: ($get(use).value == 'Twikoo' || $get(use).value == 'Artalk' || $get(use).value == 'Waline' ) && $get(commentsEnable).value
          name: lazyload
          label: 评论懒加载
          value: false
          help: 当评论进入浏览器的视窗时，将加载评论系统。(不建议使用，定位不到评论位置)
        - $formkit: group
          if: $get(commentsEnable).value &&  $get(use).value == 'Artalk'
          name: artalks
          key: artalks
          label: Artalk评论配置 (文档：https://artalk.js.org/)
          value:
            siteName: ""
            server: ""
            js: ""
            css: ""
          children:
            - $formkit: url
              name: server
              key: artalkServer
              label: Artalk评论 - 后端URL
              placeholder: 请输入后端URL
              help: 详情请查看文档 (后缀带 / )
              validation: required
            - $formkit: text
              name: siteName
              key: siteName
              label: 站点名称
              placeholder: 请输入 Artalk 站点名称
              help: Artalk 中显示的站点名称
              validation: required
            - $formkit: text
              name: artalkJs
              key: artalkJs
              label: Artalk评论 - js
              placeholder: 请输入js文件地址
              help: 主题的Artalk版本是最新版本(如果你使用的不是最新版本请自己引入js文件)
            - $formkit: text
              name: artalkCss
              key: artalkCss
              label: Artalk评论 - css
              placeholder: 请输入css文件地址
              help: 主题的Artalk版本是最新版本(如果你使用的不是最新版本请自己引入css文件)
        - $formkit: group
          if: $get(commentsEnable).value &&  $get(use).value == 'Twikoo'
          name: twikoos
          key: twikoos
          label: Twikoo评论配置 (文档：https://twikoo.js.org/)
          value:
            envId:
            accessToken:
            js: ""
          children:
            - $formkit: url
              name: envId
              key: envId
              label: Twikoo评论 - 环境id/后端URL
              placeholder: 请输入环境id或URL
              help: 详情请查看文档 (后缀带 / )
              validation: required
            - $formkit: text
              name: accessToken
              key: accessToken
              label: Twikoo评论 - 管理员令牌
              placeholder: 请输入token
              help: 在浏览器F12的控制台中获取，用于显示弹幕，详情请查看文档
              validation: required
            - $formkit: text
              name: js
              key: js
              label: Twikoo评论 - js
              placeholder: 请输入js文件地址
              help: 主题的twikoo版本是最新版本(如果你使用的不是最新版本请自己引入js文件)
        - $formkit: group
          if: $get(commentsEnable).value && $get(use).value == 'Waline'
          name: walines
          key: walines
          label: Waline评论配置 (文档：https://waline.js.org/)
          value:
            serverURL: ""
            walinesJs: ""
            walinesCss: ""
            locale: "{'placeholder': '欢迎评论', 'sofa': '来发评论吧~1'}"
          children:
            - $formkit: url
              name: serverURL
              key: serverURL
              label: Waline评论 - 后端URL
              placeholder: 请输入后端URL
              help: 详情请查看文档 (后缀不带 / )
              validation: required
            - $formkit: text
              name: walinesJs
              key: walinesJs
              label: Waline评论 - js
              placeholder: 请输入js文件地址
              help: 主题的walines版本是最新版本(如果你使用的不是最新版本请自己引入js文件)
            - $formkit: text
              name: walinesCss
              key: walinesCss
              label: Waline评论 - css
              placeholder: 请输入css文件地址
              help: 主题的walines版本是最新版本(如果你使用的不是最新版本请自己引入css文件)
            - $formkit: code
              name: locale
              height: 200px
              label: 选项
              placeholder: 请输入json格式数据
              help: "格式：{'placeholder': '欢迎评论', 'sofa': '来发评论吧~1'} 更多请查看文档：https://waline.js.org/cookbook/customize/locale.html#%E4%BE%8B%E5%AD%90"
              language: json
        - $formkit: group
          if: ($get(use).value == 'Twikoo' || $get(use).value == 'Artalk' || $get(use).value == 'Waline' ) && $get(commentsEnable).value
          name: visitorMail
          label: 评论匿名邮箱
          value:
            visitorMailEnable: true
            mail: visitor@xxx.com
          children:
            - $formkit: switch
              name: visitorMailEnable
              id: visitorMailEnable
              key: visitorMailEnable
              label: 开启匿名邮箱
              help: 允许未登录访客使用匿名邮箱进行评论
            - $formkit: text
              if: $get(visitorMailEnable).value
              name: mail
              label: 匿名邮箱
              placeholder: 例如：visitor@xxx.com
              help: 访客未登录时默认使用的匿名邮箱地址
        - $formkit: group
          name: commentBarrageConfig
          if: ($get(use).value == 'Twikoo' || $get(use).value == 'Artalk' || $get(use).value == 'Waline' ) && $get(commentsEnable).value
          label: 留言弹幕配置
          value:
            commentBarrageEnable: true
            maxBarrage: 1
            barrageTime: 4000
            mailMd5:
          children:
            - $formkit: switch
              name: commentBarrageEnable
              id: commentBarrageEnable
              key: commentBarrageEnable
              label: 开启留言弹幕
              help: 在页面右下角以弹幕形式显示最新评论，增加互动氛围
            - $formkit: number
              if: $get(commentBarrageEnable).value
              name: maxBarrage
              key: maxBarrage
              label: 同时最多显示弹幕数
              placeholder: 请输入显示弹幕数
              help: 右下角同时最多显示的弹幕数量
              validation: required
            - $formkit: number
              if: $get(commentBarrageEnable).value
              name: barrageTime
              key: barrageTime
              label: 弹幕显示间隔时间ms
              placeholder: 请输入间隔时间ms
              help: 右下角弹出热评弹幕的间隔时间
              validation: required
            - $formkit: text
              if: $get(commentBarrageEnable).value && $get(use).value != 'Waline'
              name: mailMd5
              key: mailMd5
              label: 评论 - 博主邮箱MD5值
              placeholder: 请输入md5值
              help: 用于验证博主评论，可前往cmd5.com加密自己使用的邮箱，选择32位小写
              validation: required

