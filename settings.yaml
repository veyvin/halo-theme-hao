          value:
            use: local
          children:
            - $formkit: toggle
              name: use
              id: use
              key: use
              label: 类型选择
              help: 选择静态资源加载方式，本地使用主题自带资源，自定义可使用 CDN 加速
              options:
                - label: 本地
                  value: local
                  render: 本地
                - label: 自定义
                  value: custom
                  render: 自定义
              render-type: text
              size: 72
              gap: 10
            - $formkit: url
              name: cdn_link
              if: "$get(use).value == 'custom'"
              label: CDN 地址
              validation: required
              value: 'https://npm.onmicrosoft.cn/hao-theme-static@1.3.7/templates/assets'
              help: 静态资源 CDN 地址，请确保链接下包含 assets 文件夹中的所有主题静态资源文件
              key: other_staticResource_cdn_link
              placeholder: 例如：https://cdn.example.com/theme-hao/assets
        - $formkit: group
          name: opengraph
          label: Open Graph
          value:
            image:
          children:
            - $formkit: attachment
              name: image
              label: 默认图片
              width: "15rem"
              aspectRatio: "16/9"
              help: 如果页面没有设置图片，那么将会使用此图片作为 Open Graph 图片
        - $formkit: group
          name: vanillaLazyload
          label: 懒加载
          value:
            enable: true
            errorImg: "/themes/theme-hao/assets/images/404.gif"
            loadingImg: /themes/theme-hao/assets/images/404s.gif
          children:
            - $formkit: switch
              name: enable
              id: enable
              key: enable
              label: 开启懒加载
              help: 图片在进入可视区域时才加载，提升页面加载速度
            - $formkit: attachment
              name: loadingImg
              id: loadingImg
              key: loadingImg
              if: $get(enable).value
              label: 加载占位图
              width: "15rem"
              aspectRatio: "16/9"
              validation: required
              placeholder: 请输入图片 url
              help: 图片加载过程中显示的占位图片
            - $formkit: attachment
              name: errorImg
              label: 加载失败图
              validation: required
              width: "15rem"
              aspectRatio: "16/9"
              placeholder: 请输入图片 url
              help: 图片加载失败时显示的替代图片
        - $formkit: group
          name: diytitle
          label: 动态标题
          value:
            diytitleEnable: false
          children:
            - $formkit: switch
              name: diytitleEnable
              id: diytitleEnable
              key: diytitleEnable
              label: 开启动态标题
              help: 切换浏览器标签页时动态修改网页标题，吸引用户返回
            - $formkit: text
              name: leaveTitle
              if: $get(diytitleEnable).value
              label: 离开标题
              placeholder: 例如：w(ﾟДﾟ)w 不要走！再看看嘛！
              value: w(ﾟДﾟ)w 不要走！再看看嘛！
              help: 用户切换到其他标签页时显示的标题文字
              key: other_diytitle_leaveTitle
            - $formkit: text
              name: backTitle
              if: $get(diytitleEnable).value
              label: 回到标题
              placeholder: 例如：♪(^∇^*)欢迎肥来！
              value: ♪(^∇^*)欢迎肥来！
              help: 用户切换回本页时显示的标题文字
              key: other_diytitle_backTitle
        - $formkit: group
          name: loadingBoxs
          label: 加载动画
          value:
            loadingBoxEnable: true
            loadingBoxImg: https://liuzhihang.com/upload/logo.png
            loadProgressBar: true
          children:
            - $formkit: switch
              name: loadingBoxEnable
              id: loadingBoxEnable
              key: loadingBoxEnable
              label: 开启加载动画
              help: 页面加载时显示全屏加载动画，提升视觉体验
            - $formkit: attachment
              name: loadingBoxImg
              if: $get(loadingBoxEnable).value
              label: 加载图片
              width: "15rem"
              aspectRatio: "16/9"
              placeholder: 请输入图片 url
              help: 加载动画中显示的图片，建议使用透明背景的 GIF 或 PNG
              key: other_loadingBoxs_loadingBoxImg
            - $formkit: switch
              name: loadProgressBar
              label: 加载进度条
              help: 页面顶部显示加载进度条，直观展示页面加载进度
        - $formkit: group
          name: error_404
          label: 404 页面
          value:
            subtitle: 请尝试站内搜索寻找文章
            background: /themes/theme-hao/assets/images/404s.gif
          children:
            - $formkit: text
              name: subtitle
              label: 提示文字
              placeholder: 例如：请尝试站内搜索寻找文章
              help: 404 页面显示的提示文字
            - $formkit: attachment
              name: background
              width: "15rem"
              aspectRatio: "16/9"
              label: 背景图片
              help: 404 页面的背景图片
        - $formkit: group
          name: error_500
          label: 500 页面
          value:
            subtitle: 服务器内部出现错误，请查看日志
            background: /themes/theme-hao/assets/images/404s.gif
          children:
            - $formkit: text
              name: subtitle
              label: 提示文字
              placeholder: 例如：服务器内部出现错误，请查看日志
              help: 500 页面显示的提示文字
            - $formkit: attachment
              name: background
              width: "15rem"
              aspectRatio: "16/9"
              label: 背景图片
              help: 500 页面的背景图片
        - $formkit: switch
          name: bubbleEnable
          label: 页面卡片顶部气泡升起效果
          help: 在友链鱼塘、瞬间、待办清单、我的装备等页面的卡片顶部显示气泡上升动画
          value: false
        - $formkit: switch
          name: scrollbarLinearGradientEnable
          label: 渐变滚动条效果
          value: false
          help: 浏览器滚动条使用主题色渐变样式
        - $formkit: switch
          name: tagRandomColorEnable
          label: 标签云随机颜色效果
          value: false
          help: 标签云中每个标签使用随机颜色，增加视觉层次感
        - $formkit: group
          name: greeting
          label: 首页问候语
          children:
            - $formkit: switch
              name: enable_greeting
              key: enable_greeting
              id: enable_greeting
              label: 开启首页问候语
              value: false
              help: 在首页显示动态问候语，可根据时间段显示不同问候内容
            - $formkit: array
              name: setting
              if: $get(enable_greeting).value
              label: 问候语配置
              help: 配置不同时间段的问候语，每条包含起始时间、结束时间和问候内容
              itemLabels:
                - type: text
                  label: $value.greeting
                - type: text
                  label: $value.start_time
                - type: text
                  label: $value.end_time
              value:
                - greeting: 晚安😴
                  start_time: 0
                  end_time: 5
                - greeting: 早上好鸭👋, 祝你一天好心情！
                  start_time: 6
                  end_time: 9
                - greeting: 上午好👋, 状态很好，鼓励一下
                  start_time: 10
                  end_time: 10
                - greeting: 11点多啦, 在坚持一下就吃饭啦～
                  start_time: 11
                  end_time: 11
                - greeting: 午安👋, 宝贝
                  start_time: 12
                  end_time: 14
                - greeting: 🌈充实的一天辛苦啦！
                  start_time: 14
                  end_time: 18
                - greeting: 19点喽, 奖励一顿丰盛的大餐吧🍔。
                  start_time: 19
                  end_time: 19
                - greeting: 晚上好👋, 在属于自己的时间好好放松😌~
                  start_time: 20
                  end_time: 24
              children:
                - $formkit: text
                  name: greeting
                  label: 问候内容
                  placeholder: 例如：晚上好，在属于自己的时间好好放松
                  help: 该时间段显示的问候语
                - $formkit: text
                  name: start_time
                  label: 开始时间
                  placeholder: 请输入开始时间(小时)
                  help: 与上一个问候的结束时间相同时，上一个问候在该时间生效
                - $formkit: text
                  name: end_time
                  label: 结束时间
                  placeholder: 请输入结束时间(小时)
                  help: 可以与开始时间相同，表示一个小时内的问候
              key: other_greeting_setting
    - group: hot
      label: 22 · 页面-热榜
      formSchema:
        - $formkit: number
          name: listNum
          label: 榜单数量
          value: 20
          min: 5
          max: 50
          placeholder: 例如：20
          help: 热门页按访问量展示的文章数量，建议 10-30
        - $formkit: switch
          name: showCover
          label: 显示封面
          value: true
          help: 榜单每行是否显示文章封面，关闭则只显示排名与标题
