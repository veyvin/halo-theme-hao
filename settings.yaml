        - $formkit: group
          name: translate
          label: 简繁转换
          help: 控制站点默认使用简体或繁体，以及是否允许访客手动切换
          value:
            defaultEncoding: 2
            translateEnable: true
          children:
            - $formkit: toggle
              name: defaultEncoding
              label: 默认语言
              help: 页面首次加载时使用的中文形态
              render-type: text
              size: 72
              gap: 10
              options:
                - label: 简体中文
                  value: 2
                  render: 简体
                - label: 繁體中文
                  value: 1
                  render: 繁體
            - $formkit: switch
              name: translateEnable
              label: 允许切换语言
              help: 开启后访客可在前台切换简繁体
        - $formkit: textarea
          name: fontFamily
          label: 全局字体
          placeholder: '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei"'
          help: CSS font-family 值，用于覆盖主题默认字体栈，留空则使用主题默认

