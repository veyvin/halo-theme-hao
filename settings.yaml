          value: <div class="author-content-item-tips">心路历程</div> <span class="author-content-item-title">为什么建站？</span> <br>创建这个站的时候，想要就是能够有一个自己能够<b>积累知识、积累兴趣</b>的地方。和他人分享，会让这些成为积累和沉淀。如果能够帮助到更多的人，帮助更多人解决问题，那一定是非常棒的事情。<br> 分享这件事我从很早就开始了，起初做的微信公众号，现在做的网站。因为我比较喜欢研究数码和软件，想要探究在互联网上的事物是如何被创造和发展。网络给我带来了非常多的知识和眼界，我也想力所能及的分享一些我生活的琐碎知识。<br>与大多数垂直类的技术博客不同，这里的种类会非常的繁杂，有<b>技能的教程干货</b>、有<b>生活上的吐槽和妙招</b>、有<b>话题上的思考和想法</b>。一般我研究什么、发现了什么都会分享在这里。<br> 这些就是创造这个小站的本意，<b>也是我分享生活的方式</b>。有幸能和你相遇在这里，相信我们能共同留下一段美好记忆。</p>
          height: 200px
          language: html
          help: 支持 HTML 语法
        - $formkit: group
          name: tenyear
          label: 十年之约
          value:
            tenyear_enable: true
            tenyear_tips: 始终如一，不离不弃
            tenyear_title: 十年之约
            tenyear_content: 在这个十年中，我会用心感受生活的美好，用努力书写工作的篇章，用行动诠释人生的意义。这个进度条，不仅是数字的积累，更是我心中的期许和承诺。我相信，经过十年的坚持和努力，我会收获更多，成为一个更好的自己。
            start_time: "2023-11-22"
            end_time: "2033-11-22"
          children:
            - $formkit: switch
              name: tenyear_enable
              id: tenyear_enable
              key: tenyear_enable
              label: 启用十年之约
              help: 在关于页显示十年进度条
            - $formkit: text
              key: tenyear_tips
              id: tenyear_tips
              if: $get(tenyear_enable).value
              name: tenyear_tips
              label: 提示文字
              placeholder: 例如 始终如一，不离不弃
            - $formkit: text
              key: tenyear_title
              id: tenyear_title
              if: $get(tenyear_enable).value
              name: tenyear_title
              label: 标题
              placeholder: 例如 十年之约
            - $formkit: textarea
              key: tenyear_content
              id: tenyear_content
              if: $get(tenyear_enable).value
              name: tenyear_content
              label: 描述
              placeholder: 写一段十年寄语，显示在进度条下方
            - $formkit: date
              key: tenyear-start
              id: tenyear-start
              if: $get(tenyear_enable).value
              name: start_time
              label: 开始时间
              help: 十年周期的起点
            - $formkit: date
              key: tenyear-end
              id: tenyear-end
              if: $get(tenyear_enable).value
              name: end_time
              label: 结束时间
              help: 十年周期的终点

