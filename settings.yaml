                  name: dingyue
                  id: dingyue
                  key: dingyue
                  label: 订阅
                  help: 显示 RSS 订阅入口
                - $formkit: switch
                  if: $get(default_enable).value
                  name: zhuti
                  id: zhuti
                  key: zhuti
                  label: 主题
                  help: 显示当前主题信息
                - $formkit: switch
                  if: $get(default_enable).value
                  name: about
                  id: about
                  key: about
                  label: 关于
                  help: 显示「关于」页面入口
                - $formkit: switch
                  if: $get(default_enable).value
                  name: icp_icon
                  id: icp_icon
                  key: icp_icon
                  label: ICP 备案
                  help: 显示 ICP 备案号图标
                - $formkit: switch
                  if: $get(default_enable).value
                  name: gongwangan
                  id: gongwangan
                  key: gongwangan
                  label: 公网安备案
                  help: 显示公安联网备案号图标
                - $formkit: switch
                  if: $get(default_enable).value
                  name: yingsi
                  id: yingsi
                  key: yingsi
                  label: 隐私
                  help: 显示「隐私政策」入口
                - $formkit: switch
                  if: $get(default_enable).value
                  name: yunzhichi
                  id: yunzhichi
                  key: yunzhichi
                  label: 云服务支持
                  help: 显示云服务商图标，可在下方选择服务商
