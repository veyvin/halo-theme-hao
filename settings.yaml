              help: 显示分享到微博的按钮
            - $formkit: switch
              name: copyurl_edit
              label: 复制链接
              help: 显示复制文章链接的按钮
              value: true
        - $formkit: group
          name: copyrights
          label: 版权声明
          help: 需要在发布文章时的元数据上选显示版权声明才可以生效
          value:
            enable: true
            content: '本文是原创文章，采用 <a target="_blank" href="/cc">CC BY-NC-ND 4.0</a> 协议，完整转载请注明来自 <a href="/" target="_blank" >程序员小航</a>'
            reprintContent: '本文是转载文章，版权归原作者所有。建议访问原文，转载本文请联系原作者。'
          children:
            - $formkit: switch
              name: enable
              label: 开启版权声明
              help: 文章底部显示版权声明模块
            - $formkit: text
              name: originalUrl
              label: 原创链接
              placeholder: 例如：https://example.com/original
              help: 原创文章的来源链接地址
            - $formkit: text
              name: reprintUrl
              label: 转载链接
              placeholder: 例如：https://example.com/reprint
              help: 转载文章的原文链接地址
            - $formkit: code
              name: content
              label: 原创声明内容
              placeholder: '本文是原创文章，采用 <a target="_blank" href="/cc">CC BY-NC-ND 4.0</a> 协议，完整转载请注明来自 <a href="/" target="_blank" >程序员小航</a>'
              height: 120px
              language: html
              help: 支持 HTML 语法
            - $formkit: code
              name: reprintContent
              label: 转载声明内容
              placeholder: '本文是转载文章，版权归原作者所有。建议访问原文，转载本文请联系原作者。'
              height: 120px
              language: html
              help: 支持 HTML 语法
        - $formkit: toggle
          name: recommendQuantity
          label: 阅读建议
          value: six
          help: 文章底部推荐阅读区域显示的文章数量
