          value: 0
          help: 文章分类小工具展示的分类数，0 为全部
          placeholder: 例如：8，0 表示展示全部
          min: 0
        - $formkit: number
          name: tagQuantity
          label: 文章标签
          value: 0
          help: 文章标签小工具展示的标签数，0 为全部
          placeholder: 例如：20，0 表示展示全部
          min: 0
        - $formkit: number
          name: archivesQuantity
          label: 文章归档
          value: 0
          help: 归档小工具展示的月份数（当前主题版本暂未使用）
          placeholder: 例如：5，0 表示展示全部
          min: 0
        - $formkit: switch
          name: tags_switch
          label: 标签按钮
          value: true
          help: 标签&归档&统计小工具中的标签入口开关
        - $formkit: switch
          name: archive_switch
          label: 归档按钮
          value: false
          help: 标签&归档&统计小工具中的归档入口开关
        - $formkit: group
          name: adbox
          label: 广告区域
          value:
            adType:
          children:
            - $formkit: toggle
              name: adType
              id: adType
              key: adType
              label: 广告模式
              value: none
              options:
                - label: 无
                  value: none
                  render: 无
                - label: Google AdSence
                  value: google
                  render: Google AdSence
                - label: 自定义
                  value: customAd
                  render: 自定义
              render-type: text
              size: 72
              gap: 10
              help: 无则不显示；Google 需填 client/slot；自定义需填图片与跳转链接
            - $formkit: group
              if: $get(adType).value == 'google'
              name: ad_google
              label: Google AdSence
              help: 申请地址：https://www.google.com/adsense/
              value:
                ad_client:
                ad_slot:
                ad_format:
                full_width_responsive:
              children:
                - $formkit: text
                  name: ad_client
                  label: ad_client
                  help: AdSense 广告代码中的 data-ad-client
                  placeholder: 例如：ca-pub-123456789
                - $formkit: text
                  name: ad_slot
                  label: ad_slot
                  help: 广告单元代码中的 data-ad-slot
                  placeholder: 例如：987654321
                - $formkit: toggle
                  name: ad_format
                  id: ad_format
                  key: ad_format
                  label: 广告尺寸
                  value: auto
                  help: Google AdSense 广告单元尺寸，自适应会根据容器自动调整
                  render-type: text
                  size: 72
                  gap: 8
                  options:
                    - label: 自适应
                      value: auto
                      render: 自适应
                    - label: 长方形/矩形
                      value: rectangle
                      render: 矩形
                    - label: 垂直
                      value: vertical
                      render: 垂直
                    - label: 水平横向
                      value: horizontal
                      render: 横向
                - $formkit: switch
                  name: full_width_responsive
                  id: full_width_responsive
                  key: full_width_responsive
                  value: false
                  label: 宽度自适应
                  help: 开启后广告宽度跟随容器铺满
              key: sidebar_adbox_ad_google
            - $formkit: group
              if: $get(adType).value == 'customAd'
              name: ad_custom
              label: 自定义区域
              help: 填写标题、图片地址和跳转链接，用于自定义广告位
              value:
                ad_title: '广告'
                ad_pic_url:
                ad_redirect_url:
              children:
                - $formkit: text
                  name: ad_title
                  label: 自定义标题
                  placeholder: 例如：广告
                  help: 自定义广告位标题文字
                - $formkit: text
                  name: ad_pic_url
                  label: 自定义图片地址
                  placeholder: 例如 https://example.com/ad.png
                  help: 广告图片 URL
                - $formkit: text
                  name: ad_redirect_url
                  label: 自定义跳转地址
                  placeholder: 例如 https://example.com
                  help: 点击广告后跳转的链接

              key: sidebar_adbox_ad_custom
    - group: post
      label: 06 · 文章页
      formSchema:
        - $formkit: switch
          name: dynamicBackground
          label: 动态主色
          value: true
          help: 自动提取文章封面图主色作为页面强调色，让每篇文章有独特的视觉风格
        - $formkit: switch
          name: readAloudEnable
          label: 文章朗读
          value: true
          help: 在文章页右下角显示朗读按钮，支持快捷键 Shift+T 朗读全文、Shift+P 陪读模式
        - $formkit: switch
          name: aiAssistantEnable
          label: AI 助手
          value: true
          help: 在文章页右下角显示 AI 助手按钮，支持快捷键 Shift+C，可查看摘要与页内查找
        - $formkit: switch
          name: opacity
          label: 目录模糊效果
          value: true
          help: 文章侧边目录使用毛玻璃模糊背景效果
        - $formkit: group
          name: aiDescription
          label: 文章 AI 摘要
          value:
            aiDescriptionEnable: false
            gptName:
            mode: local
            switchBtn: false
            btnLink:
            randomNum:
            basicWordCount:
            key:
            Referer:
          children:
            - $formkit: switch
              name: aiDescriptionEnable
              id: aiDescriptionEnable
              key: aiDescriptionEnable
              label: 开启 AI 摘要
              value: false
              help: 在文章页顶部显示 AI 生成的摘要卡片，支持本地摘要和天理 AI 两种模式
            - $formkit: text
              if: $get(aiDescriptionEnable).value
              name: gptName
              label: AI 名称
              placeholder: 例如：KunKunYu
              value: KunKunYu
              help: 摘要卡片中显示的 AI 助手名称
              key: post_aiDescription_gptName
            - $formkit: toggle
              if: $get(aiDescriptionEnable).value
              name: mode
              label: 模式
              value: local
              help: 本地模式需要自己填写文章摘要；AI 模式使用天理 AI 自动生成摘要
              render-type: text
              size: 64
              gap: 10
              options:
                - label: 本地
                  value: local
                  render: 本地
                - label: AI
                  value: tianli
                  render: AI
              key: post_aiDescription_mode
            - $formkit: switch
              if: $get(aiDescriptionEnable).value
              name: switchBtn
              label: 显示切换按钮
              value: false
              help: 在摘要卡片旁显示切换按钮，可跳转到打赏或赞助页面
              key: post_aiDescription_switchBtn
            - $formkit: url
              if: $get(aiDescriptionEnable).value
              name: btnLink
              label: 切换按钮链接
              placeholder: 例如：https://afdian.net/item/xxx
              value: https://afdian.net/item/f18c2e08db4411eda2f25254001e7c00
              help: 切换按钮点击后跳转的链接地址
              key: post_aiDescription_btnLink
            - $formkit: number
              if: $get(aiDescriptionEnable).value
              name: randomNum
              label: 摘要随机条数
              value: 3
              help: 本地模式下每篇文章预置的摘要条数
              key: post_aiDescription_randomNum
              placeholder: 例如：3
              min: 1
            - $formkit: number
              if: $get(aiDescriptionEnable).value
              name: basicWordCount
              label: 截取字数下限
              value: 1000
              help: 天理 AI 模式下发送给接口的最小字符数
              key: post_aiDescription_basicWordCount
              placeholder: 例如：1000
              min: 1000
            - $formkit: text
              if: $get(aiDescriptionEnable).value
              name: key
              label: API Key
              value: xxxx
              placeholder: 粘贴天理 AI 的 API Key，仅 AI 模式需要
              help: 天理 AI 摘要服务的密钥，仅在 AI 模式下需要填写
              key: post_aiDescription_key
            - $formkit: url
              if: $get(aiDescriptionEnable).value
              name: Referer
              label: 博客地址（鉴权）
              help: 天理 AI 接口鉴权用的博客地址，注意保留末尾斜杠
              value: https://xx.xx/
              key: post_aiDescription_Referer
              placeholder: 例如：https://xxx.com/
              validation: url
        - $formkit: group
          name: passage_tips
          label: 温馨提示
          value:
            enable: false
            content: 文章内容可能已经过时。
            day: 7
          children:
            - $formkit: switch
              name: enable
              id: enable
              label: 开启温馨提示
              help: 文章更新超过指定天数后，在顶部显示内容可能过时的提示
            - $formkit: number
              if: "$get(enable).value"
              name: day
              label: 过期天数
              validation: required
              help: 文章更新时间超过此天数后才显示温馨提示，单位为天
              key: post_passage_tips_day
              placeholder: 例如：30
              min: 1
            - $formkit: code
              if: "$get(enable).value"
              name: content
              height: 100px
              label: 温馨提示文案
              help: 自定义温馨提示的文案，支持 HTML 语法
              language: html
              key: post_passage_tips_content
        - $formkit: switch
          name: update_time
          label: 显示最后更新时间
          value: false
          help: 在文章页面显示文章的最后更新时间
        - $formkit: toggle
          name: copyrightsStyle
          id: copyrightsStyle
          key: copyrightsStyle
          label: 版权样式
          value: default
          help: 默认工具条在上版权卡在下；样式一作者组在上工具条居中
          options:
            - value: default
              label: 默认
              render: /themes/theme-hao/assets/images/settings/copyright-default.svg
            - value: one
              label: 样式一
              render: /themes/theme-hao/assets/images/settings/copyright-one.svg
          render-type: image
          size: 120
          gap: 12
        - $formkit: text
          if: $get(copyrightsStyle).value == 'one'
          name: desc
          value: "分享设计与科技生活"
          label: 版权描述一句话
          help: 版权样式一中显示的一句话描述
          key: post_desc
          placeholder: 例如：分享设计与科技生活
        - $formkit: group
          name: post_edit
          label: 运营模式与责任
          value:
            enable_post_edit: false
            post_edit_url: "/rss"
          children:
            - $formkit: switch
              name: enable_post_edit
              id: enable_post_edit
              key: enable_post_edit
              label: 开启运营模式与责任
              help: 启用文章运营模式与责任，请正确填写链接
            - $formkit: url
              name: post_edit_url
              if: $get(enable_post_edit).value
              label: 运营模式与责任地址
              placeholder: 例如：/rss
              help: 运营模式与责任声明的页面链接地址
              key: post_post_edit_post_edit_url
        - $formkit: group
          name: share_right
          label: 分享按钮
          value:
            mobile_edit: true
            weibo_edit: true
            copyurl_edit: true
          children:
            - $formkit: switch
              name: mobile_edit
              label: 手机访问二维码
              help: 显示手机扫码访问文章的二维码
              value: true
            - $formkit: switch
              name: weibo_edit
              label: 分享到微博
              help: 显示分享到微博的按钮
            - $formkit: switch
              name: copyurl_edit
              label: 复制链接
              help: 显示复制文章链接的按钮
              value: true
        - $formkit: group
          name: copyrights
          label: 版权声明
          help: 需要在发布文章时的元数据上选显示版权声明才可以生效
          value:
            enable: true
            content: '本文是原创文章，采用 <a target="_blank" href="/cc">CC BY-NC-ND 4.0</a> 协议，完整转载请注明来自 <a href="/" target="_blank" >程序员小航</a>'
            reprintContent: '本文是转载文章，版权归原作者所有。建议访问原文，转载本文请联系原作者。'
          children:
            - $formkit: switch
              name: enable
              label: 开启版权声明
              help: 文章底部显示版权声明模块
            - $formkit: text
              name: originalUrl
              label: 原创链接
              placeholder: 例如：https://example.com/original
              help: 原创文章的来源链接地址
            - $formkit: text
              name: reprintUrl
              label: 转载链接
              placeholder: 例如：https://example.com/reprint
              help: 转载文章的原文链接地址
            - $formkit: code
              name: content
              label: 原创声明内容
              placeholder: '本文是原创文章，采用 <a target="_blank" href="/cc">CC BY-NC-ND 4.0</a> 协议，完整转载请注明来自 <a href="/" target="_blank" >程序员小航</a>'
              height: 120px
              language: html
              help: 支持 HTML 语法
            - $formkit: code
              name: reprintContent
              label: 转载声明内容
              placeholder: '本文是转载文章，版权归原作者所有。建议访问原文，转载本文请联系原作者。'
              height: 120px
              language: html
              help: 支持 HTML 语法
        - $formkit: toggle
          name: recommendQuantity
          label: 阅读建议
          value: six
          help: 文章底部推荐阅读区域显示的文章数量
          render-type: text
          size: 56
          gap: 10
          options:
            - value: two
              label: 两篇
              render: 2 篇
            - value: six
              label: 六篇
              render: 6 篇

    - group: comments
      label: 07 · 评论
      formSchema:
        - $formkit: switch
          name: commentsEnable
          id: commentsEnable
          key: commentsEnable
          label: 开启评论
          value: true
          help: 开启文章和页面的评论功能，可在下方选择评论系统
        - $formkit: select
          name: use
          label: 评论系统
          id: use
          key: use
          if: $get(commentsEnable).value
          value: commentWidget
          help: 选择评论系统，支持默认、Twikoo、Artalk 和 Waline
          options:
            - label: 默认
              value: commentWidget
            - label: Twikoo
              value: Twikoo
            - label: Artalk
              value: Artalk
            - label: Waline
              value: Waline
        - $formkit: switch
          if: ($get(use).value == 'Twikoo' || $get(use).value == 'Artalk' || $get(use).value == 'Waline' ) && $get(commentsEnable).value
          name: lazyload
          label: 评论懒加载
          value: false
          help: 当评论进入浏览器的视窗时，将加载评论系统。(不建议使用，定位不到评论位置)
          key: comments_lazyload
        - $formkit: group
          if: $get(commentsEnable).value &&  $get(use).value == 'Artalk'
          name: artalks
          key: artalks
          label: Artalk评论配置 (文档：https://artalk.js.org/)
          value:
            siteName: ""
            server: ""
            js: ""
            css: ""
          children:
            - $formkit: url
              name: server
              key: artalkServer
              label: Artalk评论 - 后端URL
              placeholder: 请输入后端URL
              help: 详情请查看文档 (后缀带 / )
              validation: required
            - $formkit: text
              name: siteName
              key: siteName
              label: 站点名称
              placeholder: 请输入 Artalk 站点名称
              help: Artalk 中显示的站点名称
              validation: required
            - $formkit: text
              name: artalkJs
              key: artalkJs
              label: Artalk评论 - js
              placeholder: 请输入js文件地址
              help: 主题的Artalk版本是最新版本(如果你使用的不是最新版本请自己引入js文件)
            - $formkit: text
              name: artalkCss
              key: artalkCss
              label: Artalk评论 - css
              placeholder: 请输入css文件地址
              help: 主题的Artalk版本是最新版本(如果你使用的不是最新版本请自己引入css文件)
        - $formkit: group
          if: $get(commentsEnable).value &&  $get(use).value == 'Twikoo'
          name: twikoos
          key: twikoos
          label: Twikoo评论配置 (文档：https://twikoo.js.org/)
          value:
            envId:
            accessToken:
            js: ""
          children:
            - $formkit: url
              name: envId
              key: envId
              label: Twikoo评论 - 环境id/后端URL
              placeholder: 请输入环境id或URL
              help: 详情请查看文档 (后缀带 / )
              validation: required
            - $formkit: text
              name: accessToken
              key: accessToken
              label: Twikoo评论 - 管理员令牌
              placeholder: 请输入token
              help: 在浏览器F12的控制台中获取，用于显示弹幕，详情请查看文档
              validation: required
            - $formkit: text
              name: js
              key: js
              label: Twikoo评论 - js
              placeholder: 请输入js文件地址
              help: 主题的twikoo版本是最新版本(如果你使用的不是最新版本请自己引入js文件)
        - $formkit: group
          if: $get(commentsEnable).value && $get(use).value == 'Waline'
          name: walines
          key: walines
          label: Waline评论配置 (文档：https://waline.js.org/)
          value:
            serverURL: ""
            walinesJs: ""
            walinesCss: ""
            locale: "{'placeholder': '欢迎评论', 'sofa': '来发评论吧~1'}"
          children:
            - $formkit: url
              name: serverURL
              key: serverURL
              label: Waline评论 - 后端URL
              placeholder: 请输入后端URL
              help: 详情请查看文档 (后缀不带 / )
              validation: required
            - $formkit: text
              name: walinesJs
              key: walinesJs
              label: Waline评论 - js
              placeholder: 请输入js文件地址
              help: 主题的walines版本是最新版本(如果你使用的不是最新版本请自己引入js文件)
            - $formkit: text
              name: walinesCss
              key: walinesCss
              label: Waline评论 - css
              placeholder: 请输入css文件地址
              help: 主题的walines版本是最新版本(如果你使用的不是最新版本请自己引入css文件)
            - $formkit: code
              name: locale
              height: 200px
              label: 选项
              placeholder: 请输入json格式数据
              help: "格式：{'placeholder': '欢迎评论', 'sofa': '来发评论吧~1'} 更多请查看文档：https://waline.js.org/cookbook/customize/locale.html#%E4%BE%8B%E5%AD%90"
              language: json
        - $formkit: group
          if: ($get(use).value == 'Twikoo' || $get(use).value == 'Artalk' || $get(use).value == 'Waline' ) && $get(commentsEnable).value
          name: visitorMail
          label: 评论匿名邮箱
          value:
            visitorMailEnable: true
            mail: visitor@xxx.com
          children:
            - $formkit: switch
              name: visitorMailEnable
              id: visitorMailEnable
              key: visitorMailEnable
              label: 开启匿名邮箱
              help: 允许未登录访客使用匿名邮箱进行评论
            - $formkit: text
              if: $get(visitorMailEnable).value
              name: mail
              label: 匿名邮箱
              placeholder: 例如：visitor@xxx.com
              help: 访客未登录时默认使用的匿名邮箱地址
              key: comments_visitorMail_mail
          key: comments_visitorMail
        - $formkit: group
          name: commentBarrageConfig
          if: ($get(use).value == 'Twikoo' || $get(use).value == 'Artalk' || $get(use).value == 'Waline' ) && $get(commentsEnable).value
          label: 留言弹幕配置
          value:
            commentBarrageEnable: true
            maxBarrage: 1
            barrageTime: 4000
            mailMd5:
          children:
            - $formkit: switch
              name: commentBarrageEnable
              id: commentBarrageEnable
              key: commentBarrageEnable
              label: 开启留言弹幕
              help: 在页面右下角以弹幕形式显示最新评论，增加互动氛围
            - $formkit: number
              if: $get(commentBarrageEnable).value
              name: maxBarrage
              key: maxBarrage
              label: 同时最多显示弹幕数
              placeholder: 请输入显示弹幕数
              help: 右下角同时最多显示的弹幕数量
              validation: required
              min: 1
            - $formkit: number
              if: $get(commentBarrageEnable).value
              name: barrageTime
              key: barrageTime
              label: 弹幕间隔(ms)
              placeholder: 例如：4000
              help: 右下角弹出热评弹幕的间隔时间
              validation: required
              min: 1000
              step: 500
            - $formkit: text
              if: $get(commentBarrageEnable).value && $get(use).value != 'Waline'
              name: mailMd5
              key: mailMd5
              label: 评论 - 博主邮箱MD5值
              placeholder: 请输入md5值
              help: 用于验证博主评论，可前往cmd5.com加密自己使用的邮箱，选择32位小写
              validation: required

