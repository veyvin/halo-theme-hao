          id: enable_title
          if: $get(enable).value
          label: 启用代码标题
          help: 启用代码块的标题，默认显示语言类型，也可自定义标题
          value: true
        - $formkit: switch
          name: enable_hr
          key: enable_hr
          id: enable_hr
          if: $get(enable).value
          label: 启用代码标题分割线
          help: 启用代码标题和内容之间的分割线，不展示时会更加简洁
          value: true
        - $formkit: switch
          name: enable_line
          key: enable_line
          id: enable_line
          if: $get(enable).value
          label: 启用代码行号
          help: 启用代码块行号功能
          value: true
        - $formkit: switch
