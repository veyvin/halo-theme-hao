                  label: 云服务商
                  help: 选择云服务商图标，选择「自定义地址」可上传自己的图标
                  options:
                    - value: upyun_cloud
                      label: 又拍云
                    - value: aliyun_cloud
                      label: 阿里云
                    - value: tencent_cloud
                      label: 腾讯云
                    - value: huawei_cloud
                      label: 华为云
                    - value: custom_cloud
                      label: 自定义地址
                - $formkit: attachment
                  name: yunzhichi_url
                  id: yunzhichi_url
                  key: yunzhichi_url
                  label: 自定义云支持地址
                  if: $get(yunzhichi_list).value == 'custom_cloud'
                  value:
                  placeholder: 请输入自定义云支持地址
                  help: 自定义云服务商的图标图片地址
                  width: 12rem
                  aspectRatio: 14/8
                - $formkit: attachment
                  name: yunzhichi_url_link
                  id: yunzhichi_url_link
                  key: yunzhichi_url_link
                  label: 自定义云支持跳转地址
                  if: $get(yunzhichi_list).value == 'custom_cloud'
                  value:
                  placeholder: 例如：https://www.aliyun.com
                  help: 点击云支持图标后跳转的链接地址
                  validation: url
                  width: 15rem
                  aspectRatio: 16/9
            - $formkit: group
              name: style_one
              label: 中间板块
              value:
              children:
                - $formkit: switch
                  name: owner_enable
                  label: 网站所有者
                  help: 显示网站所有者信息
                - $formkit: switch
                  name: runtime_enable
                  id: runtime_enable
                  label: 运行时间
                  help: 根据建站时间显示站点已运行时长，支持上班/下班不同徽标
                - $formkit: attachment
                  if: $get(runtime_enable).value
                  key: work_img
                  name: work_img
                  label: 上班时间的徽标
                  width: "12rem"
                  aspectRatio: "14/8"
                  placeholder: 请上传上班时间显示的徽标图片
                  help: 工作时间段显示的徽标图片，建议使用 shields.io 风格的 SVG
                - $formkit: text
                  if: $get(runtime_enable).value
                  key: work_description
                  name: work_description
                  label: 上班时间的 title 描述
                  placeholder: 例如：距离月入25k也就还差一个大佬带我~
                  help: 鼠标悬停上班徽标时显示的提示文字
                - $formkit: attachment
                  if: $get(runtime_enable).value
                  key: offduty_img
                  name: offduty_img
                  label: 下班时间的徽标
                  width: "12rem"
                  aspectRatio: "14/8"
                  placeholder: 请上传下班时间显示的徽标图片
                  help: 非工作时间段显示的徽标图片，建议使用 shields.io 风格的 SVG
                - $formkit: text
                  if: $get(runtime_enable).value
                  key: offduty_description
                  name: offduty_description
                  label: 下班时间的 title 描述
                  placeholder: 例如：下班了就该开开心心的玩耍，嘿嘿~
                  help: 鼠标悬停下班徽标时显示的提示文字
                - $formkit: switch
                  name: bdageitem_enable
                  id: bdageitem_enable
                  label: 开启徽标配置
                  help: 在页脚中间显示自定义徽标列表，如博客框架、技术栈等
                - $formkit: array
                  name: bdageitem
                  label: 徽标配置项
                  if: $get(bdageitem_enable).value
                  help: 添加自定义徽标，每个徽标包含链接、图标和提示文字
                  itemLabels:
                    - type: text
                      label: $value.message
                    - type: text
                      label: $value.link
                  value:
                  children:
                    - $formkit: url
                      name: link
                      label: 徽标跳转链接
                      placeholder: 例如：https://halo.run/
                      value: "https://halo.run/"
                      validation: required
                      help: 点击徽标后跳转的地址
                    - $formkit: attachment
                      name: shields
                      label: 徽标图片
                      placeholder: 请输入内容
                      validation: required
                      width: "12rem"
                      aspectRatio: "14/8"
                      value: "https://npm.onmicrosoft.cn/hao-theme-static@1.3.6/images/Frame-Halo-blue.svg"
                      help: 建议 shields.io 风格 SVG，宽高比约 14:8
                    - $formkit: text
                      name: message
                      label: 徽标悬停提示
                      placeholder: 例如：博客框架为 halo2.x
                      validation: required
                      value: "博客框架为halo2.x"

                      help: 鼠标悬停徽标时显示的 title 文字
                  key: footer_footerContent_style_one_bdageitem
    - group: style
      label: 09 · 外观样式
      formSchema:
        - $formkit: toggle
          name: colorScheme
          label: 默认配色
          value: system
          help: 首次访问时默认使用的配色方案，用户可手动切换并记住选择
          render-type: text
          size: 56
          gap: 10
          options:
            - label: 跟随系统
              value: system
              render: 系统
            - label: 深色
              value: dark
              render: 深色
            - label: 浅色
              value: light
              render: 浅色
        - $formkit: color
          name: themeLightSkin
          label: 主题浅色基色
          value: "#425AEF"
          help: 浅色模式下的主色调，影响按钮、链接等强调元素
        - $formkit: color
          name: themeDarkSkin
          label: 主题深色基色
          value: "#f2b94b"
          help: 深色模式下的主色调，影响按钮、链接等强调元素
        - $formkit: switch
          name: universe
