    - group: post
      label: 文章
      formSchema:
        - $formkit: switch
          name: dynamicBackground
          label: 动态主色
          value: true
          help: 自动提取文章封面图主色作为页面强调色，让每篇文章有独特的视觉风格
        - $formkit: switch
          name: opacity
          label: 目录模糊效果
          value: true
          help: 文章侧边目录使用毛玻璃模糊背景效果
        - $formkit: group
          name: aiDescription
          label: 文章 AI 摘要
          value:
            aiDescriptionEnable: false
            gptName:
            mode: local
            switchBtn: false
            btnLink:
            randomNum:
            basicWordCount:
            key:
            Referer:
          children:
            - $formkit: switch
              name: aiDescriptionEnable
              id: aiDescriptionEnable
              key: aiDescriptionEnable
              label: 开启 AI 摘要
              value: false
              help: 在文章页顶部显示 AI 生成的摘要卡片，支持本地摘要和天理 AI 两种模式
            - $formkit: text
              if: $get(aiDescriptionEnable).value
              name: gptName
              label: AI 名称
              placeholder: 例如：KunKunYu
              value: KunKunYu
              help: 摘要卡片中显示的 AI 助手名称
            - $formkit: toggle
              if: $get(aiDescriptionEnable).value
              name: mode
              label: 模式
              value: local
              help: 本地模式需要自己填写文章摘要；AI 模式使用天理 AI 自动生成摘要
              render-type: text
              size: 64
              gap: 10
              options:
                - label: 本地
                  value: local
                  render: 本地
                - label: AI
                  value: tianli
                  render: AI
            - $formkit: switch
              if: $get(aiDescriptionEnable).value
              name: switchBtn
              label: 显示切换按钮
              value: false
              help: 在摘要卡片旁显示切换按钮，可跳转到打赏或赞助页面
            - $formkit: url
              if: $get(aiDescriptionEnable).value
              name: btnLink
              label: 切换按钮链接
              placeholder: 例如：https://afdian.net/item/xxx
              value: https://afdian.net/item/f18c2e08db4411eda2f25254001e7c00
              help: 切换按钮点击后跳转的链接地址
            - $formkit: number
              if: $get(aiDescriptionEnable).value
              name: randomNum
              label: 随机次数
              value: 3
              help: 按钮最大的随机次数，也就是一篇文章最大随机出来几种
            - $formkit: number
              if: $get(aiDescriptionEnable).value
              name: basicWordCount
              label: 字符数
              value: 1000
              help: 最低获取字符数, 最小1000, 最大1999
            - $formkit: text
              if: $get(aiDescriptionEnable).value
              name: key
              label: API Key
              value: xxxx
              placeholder: 请输入天理 AI 的 key
              help: 天理 AI 摘要服务的密钥，仅在 AI 模式下需要填写
            - $formkit: url
              if: $get(aiDescriptionEnable).value
              name: Referer
              label: 博客地址
              help: 你的博客地址，用于天理 AI 接口鉴权，注意保留最后的斜杠
              value: https://xx.xx/
        - $formkit: group
          name: passage_tips
          label: 温馨提示
          value:
            enable: false
            content: 文章内容可能已经过时。
            day: 7
          children:
            - $formkit: switch
              name: enable
              id: enable
              label: 开启温馨提示
              help: 文章更新超过指定天数后，在顶部显示内容可能过时的提示
            - $formkit: number
              if: "$get(enable).value"
              name: day
              label: 过期天数
              validation: required
              help: 文章更新时间超过此天数后才显示温馨提示，单位为天
            - $formkit: code
              if: "$get(enable).value"
              name: content
              height: 100px
              label: 温馨提示文案
              help: 自定义温馨提示的文案，支持 HTML 语法
              language: html
        - $formkit: switch
          name: update_time
          label: 显示最后更新时间
          value: false
          help: 在文章页面显示文章的最后更新时间
        - $formkit: select
          name: copyrightsStyle
          id: copyrightsStyle
          key: copyrightsStyle
          label: 版权样式
          value: default
          help: 选择文章底部版权声明的展示样式
          options:
            - value: default
              label: 默认
            - value: one
              label: 样式一
        - $formkit: text
          if: $get(copyrightsStyle).value == 'one'
          name: desc
          value: "分享设计与科技生活"
          label: 版权样式一描述
          help: 版权样式一中显示的描述文字
        - $formkit: group
          name: post_edit
          label: 运营模式与责任
          value:
            enable_post_edit: false
            post_edit_url: "/rss"
          children:
            - $formkit: switch
              name: enable_post_edit
              id: enable_post_edit
              key: enable_post_edit
              label: 开启运营模式与责任
              help: 启用文章运营模式与责任，请正确填写链接
            - $formkit: url
              name: post_edit_url
              if: $get(enable_post_edit).value
              label: 运营模式与责任地址
              placeholder: 例如：/rss
              help: 运营模式与责任声明的页面链接地址
        - $formkit: group
          name: share_right
          label: 分享按钮
          value:
            mobile_edit: true
            weibo_edit: true
            copyurl_edit: true
          children:
            - $formkit: switch
              name: mobile_edit
