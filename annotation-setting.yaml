apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-post
spec:
  targetRef:
    group: content.halo.run
    kind: Post
  formSchema:
    - $formkit: "toggle"
      name: "homeCardCoverMode"
      id: "homeCardCoverMode"
      key: "homeCardCoverMode"
      label: "首页封面样式"
      help: "图片封面直接使用文章封面图；渐变艺术字无需配图，靠配色与排版生成海报式封面"
      value: "image"
      render-type: image
      size: 120
      gap: 12
      options:
        - label: "图片封面"
          value: "image"
          render: "/themes/theme-hao/assets/images/settings/cover-mode-image.svg"
        - label: "渐变艺术字"
          value: "gradient"
          render: "/themes/theme-hao/assets/images/settings/cover-mode-gradient.svg"
    - $formkit: "text"
      name: "homeCardCoverTitle"
      id: "homeCardCoverTitle"
      key: "homeCardCoverTitle"
      label: "艺术字主标题"
      if: "$get(homeCardCoverMode).value == 'gradient'"
      placeholder: "留空则使用文章标题，例如：慢生长"
      help: "海报中央大字，建议 4-10 个字，留空自动取文章标题"
    - $formkit: "text"
      name: "homeCardCoverSubtitle"
      id: "homeCardCoverSubtitle"
      key: "homeCardCoverSubtitle"
      label: "艺术字副标题"
      if: "$get(homeCardCoverMode).value == 'gradient'"
      placeholder: "可选，例如 Slow Growth"
      help: "主标题下方的英文小字，用于补充氛围，建议全大写短语"
    - $formkit: "text"
      name: "homeCardCoverBadge"
      id: "homeCardCoverBadge"
      key: "homeCardCoverBadge"
      label: "右上角标签"
      if: "$get(homeCardCoverMode).value == 'gradient'"
      placeholder: "可选，例如 TRENDING / NEW"
      help: "封面右上角的小徽标，留空则不显示"
    - $formkit: "attachment"
      name: "homeCardCoverLogo"
      id: "homeCardCoverLogo"
      key: "homeCardCoverLogo"
      label: "封面徽标"
      if: "$get(homeCardCoverMode).value == 'gradient'"
      placeholder: "中间圆形徽标，可上传 png/webp"
      help: "显示在封面中央的圆形徽标，建议使用透明底 png / webp，留空则不显示"
      accepts:
        - 'image/*'
    - $formkit: "toggle"
      name: "homeCardCoverPreset"
      id: "homeCardCoverPreset"
      key: "homeCardCoverPreset"
      label: "海报风格"
      if: "$get(homeCardCoverMode).value == 'gradient'"
      help: "三种预设决定纹理与光影走向，颜色仍可用下方三色自定义"
      value: "tech"
      render-type: color
      size: 48
      gap: 12
      options:
        - label: "科技感"
          value: "tech"
          render: "#6D5CFF"
        - label: "杂志感"
          value: "editorial"
          render: "#E8D5B7"
        - label: "黑金感"
          value: "luxury"
          render: "#C9A227"
    - $formkit: "color"
      name: "homeCardCoverStart"
      id: "homeCardCoverStart"
      key: "homeCardCoverStart"
      label: "渐变起始色"
      if: "$get(homeCardCoverMode).value == 'gradient'"
      help: "海报背景渐变的起始色，建议与结束色保持明度差"
      value: "#6D5CFF"
    - $formkit: "color"
      name: "homeCardCoverEnd"
      id: "homeCardCoverEnd"
      key: "homeCardCoverEnd"
      label: "渐变结束色"
      if: "$get(homeCardCoverMode).value == 'gradient'"
      help: "海报背景渐变的结束色，与起始色形成对角过渡"
      value: "#1EC8A5"
    - $formkit: "color"
      name: "homeCardCoverAccent"
      id: "homeCardCoverAccent"
      key: "homeCardCoverAccent"
      label: "高光点缀色"
      if: "$get(homeCardCoverMode).value == 'gradient'"
      help: "用于徽标描边、高光圆点的点缀色，宜用明亮撞色"
      value: "#F6D365"
    - $formkit: "color"
      name: "homeCardCoverTextColor"
      id: "homeCardCoverTextColor"
      key: "homeCardCoverTextColor"
      label: "文字颜色"
      if: "$get(homeCardCoverMode).value == 'gradient'"
      help: "主副标题与徽标文字的颜色，深色底用白色，浅色底用深色"
      value: "#FFFFFF"
    - $formkit: "toggle"
      name: "ai"
      id: "ai-post"
      key: "ai-post"
      label: "AI 摘要"
      help: "关闭后文章页不显示 AI 摘要卡片；默认跟随主题后台设置"
      render-type: text
      size: 56
      gap: 8
      options:
        - label: "启用"
          value: "true"
          render: "启用"
        - label: "禁用"
          value: "false"
          render: "禁用"
    - $formkit: "toggle"
      name: "copyrightEnable"
      id: "copyrightEnable"
      key: "copyrightEnable"
      label: "显示版权声明"
      help: "关闭后文章页底部不显示版权卡片；默认跟随主题后台设置"
      render-type: text
      size: 56
      gap: 8
      options:
        - label: "显示"
          value: "true"
          render: "显示"
        - label: "隐藏"
          value: "false"
          render: "隐藏"
    - $formkit: "toggle"
      name: "copyrightType"
      id: "copyrightType"
      key: "copyrightType"
      label: "版权声明类型"
      value: "original"
      if: "$get(copyrightEnable).value != 'false'"
      help: "原创显示作者与协议，转载需配合下方链接注明出处"
      render-type: text
      size: 56
      gap: 8
      options:
        - label: "原创"
          value: "original"
          render: "原创"
        - label: "转载"
          value: "reprint"
          render: "转载"
    - $formkit: "text"
      name: "copyrightUrl"
      id: "copyrightUrl"
      key: "copyrightUrl"
      label: "版权声明链接"
      help: "转载时填写原文链接，原创可留空；默认跟随主题后台设置"
      if: "$get(copyrightEnable).value != 'false'"
      placeholder: "例如 https://example.com/original-post"
    - $formkit: attachment
      name: "audio"
      id: "post-audio"
      key: "post-audio"
      label: "音频文件"
      help: "绑定后可在侧边栏「文章音频播放器」小工具中播放"
      placeholder: "请选择或上传音频"
      accepts:
        - 'audio/*'
---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-menu
spec:
  targetRef:
    group: ""
    kind: MenuItem
  formSchema:
    - $formkit: "text"
      name: "icon"
      id: "menu-icon"
      key: "menu-icon"
      label: "图标"
      placeholder: "例如 haofont hao-icon-home 或 #icon-shouye"
      help: "支持主题 haofont 图标类名；开启 IconFont Symbol 后也支持 #icon-xxx 彩色图标，留空则不显示图标"
    - $formkit: "toggle"
      name: "isVertical"
      id: "menu-isVertical"
      key: "menu-isVertical"
      value: "0"
      label: "子菜单是否为垂直菜单"
      help: "设为是后，该菜单的子菜单以纵向下拉面板展示，适合子项较多的分组"
      render-type: text
      size: 48
      gap: 8
      options:
        - label: "是"
          value: "1"
          render: "是"
        - label: "否"
          value: "0"
          render: "否"
---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-link-group
spec:
  targetRef:
    group: core.halo.run
    kind: LinkGroup
  formSchema:
    - $formkit: "toggle"
      name: "displayStyle"
      id: "linkGroup-displayStyle"
      key: "linkGroup-displayStyle"
      label: "分组方式"
      help: "默认列表平铺，美化为卡片式大图，失联用于归档不再维护的分组"
      value: "default"
      render-type: text
      size: 64
      gap: 10
      options:
        - label: "默认"
          value: "default"
          render: "默认"
        - label: "美化"
          value: "beautify"
          render: "美化"
        - label: "失联"
          value: "deprecated"
          render: "失联"
    - $formkit: "textarea"
      name: "description"
      id: "linkGroup-description"
      key: "linkGroup-description"
      label: "描述"
      placeholder: "例如：这里收录了常看的技术博客，欢迎互换友链"
      help: "显示在友链分组标题下方的简介，留空则不显示"

---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-link
spec:
  targetRef:
    group: core.halo.run
    kind: Link
  formSchema:
    - $formkit: "attachment"
      name: "siteshot"
      id: "link-siteshot"
      key: "link-siteshot"
      label: "背景"
      help: "美化分组下友链卡片的背景大图，建议 800x450，留空则使用站点 Logo"
      placeholder: "请选择或上传背景图"
    - $formkit: "text"
      name: "label"
      id: "link-label"
      key: "link-label"
      label: "标签"
      placeholder: "例如 力荐 / 常逛 / 大佬"
      help: "显示在友链卡片角落的小标签，留空则不显示"
    - $formkit: "color"
      name: "labelColor"
      id: "link-labelColor"
      key: "link-labelColor"
      value: "#425AEF"
      label: "标签颜色"
      help: "上方标签徽标的背景色，建议与站点主色保持一致"

---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-photo-group
spec:
  targetRef:
    group: core.halo.run
    kind: PhotoGroup
  formSchema:
    - $formkit: "attachment"
      name: "cover"
      id: "photoGroup-cover"
      key: "photoGroup-cover"
      label: "分组图片"
      help: "相册列表页该分组的封面，建议正方形，留空则取组内第一张照片"
      placeholder: "请选择或上传封面"
    - $formkit: "attachment"
      name: "background"
      id: "photoGroup-background"
      key: "photoGroup-background"
      label: "分组顶部 banner 图片"
      help: "进入该分组后顶部的宽幅横图，建议 1920x480，留空则使用默认头图"
      placeholder: "请选择或上传横图"
    - $formkit: "textarea"
      name: "description"
      id: "photoGroup-description"
      key: "photoGroup-description"
      label: "分组描述"
      placeholder: "例如：2024 年旅行途中随手拍的风景与街头"
      help: "显示在分组横幅下方的简介，留空则不显示"
