<th:block th:fragment="comment(group, kind, name, allowComment)" th:if="${allowComment && theme.config.comments.commentsEnable}">
    <!-- 已知问题 PJAX 下，comment 首次请求会出错。当前的临时解决办法是使用 js 重试 -->
    <div id="post-comment">
        <div class="comment-head">
            <div class="comment-headline">
                <i class="haofont hao-icon-chat--fill" style="font-size: 20px;"></i>
                <span th:text="${#messages.msg('page.comments.title')}"></span>
            </div>
            <div class="comment-randomInfo">
                <a th:if="${theme.config.comments.visitorMail.visitorMailEnable}"
                   sec:authorize="!isAuthenticated()"
                   onclick="heo.addRandomCommentInfo()" href="javascript:void(0)"
                   th:text="${#messages.msg('comment.anonymous')}"></a>
                <a href="/privacy" th:text="${#messages.msg('comment.privacy')}"></a>
            </div>
            <div class="comment-tips" id="comment-tips">
                <span th:text="${#messages.msg('comment.tip')}" aria-live="polite"></span>
            </div>
        </div>

        <!-- 对齐 zhheo：comment-wrap 包裹评论组件 -->
        <div class="comment-wrap">
            <div>
                <div th:if="${#strings.equals(theme.config.comments.use, 'Twikoo') &&
                         not #strings.isEmpty(theme.config.comments.twikoos.envId)}"
                     id="twikoo-wrap"></div>

                <div th:if="${#strings.equals(theme.config.comments.use, 'Artalk') && not #strings.isEmpty(theme.config.comments.artalks.server)}"
                     id="artalk-wrap"></div>

                <div th:if="${#strings.equals(theme.config.comments.use, 'Waline')
                      && not #strings.isEmpty(theme.config.comments.walines.serverURL)}" id="waline-wrap"></div>

                <halo:comment th:if="${pluginFinder.available('PluginCommentWidget') && #strings.equals(theme.config.comments.use, 'commentWidget')}"
                              th:attr="name=${name},kind=${kind},group=${group}"
                              colorScheme="document.documentElement.getAttribute('data-theme')"/>
            </div>
        </div>
    </div>
    <div style="text-align:center;margin:12px 0;">
        <button type="button" id="comment-load-more" onclick="loadMoreComments()" aria-live="polite"
                style="padding:6px 14px;border:none;border-radius:6px;background:var(--heo-main-op);color:var(--heo-main);cursor:pointer;">
            [[${#messages.msg('common.loadMoreComments')}]]
        </button>
    </div>
    <script>
        function loadMoreComments() {
            var clicked = false;
            // Twikoo 原生：优先调用其内部加载更多
            try {
                if (window.twikoo && typeof window.twikoo.getComments === 'function') {
                    window.twikoo.getComments({ replace: false });
                    clicked = true;
                }
            } catch (e) {}
            // Artalk 原生
            try {
                if (!clicked && window.Artalk && typeof window.Artalk.loadMore === 'function') {
                    window.Artalk.loadMore();
                    clicked = true;
                }
            } catch (e) {}
            // 通用：点击组件内部的加载更多按钮
            if (!clicked) {
                var selectors = ['.tk-load-more', '.atk-load-more', '.wl-more', '#load-more', '.comment-load-more', 'button[data-action="load-more"]'];
                selectors.forEach(function (sel) {
                    var btns = document.querySelectorAll(sel);
                    btns.forEach(function (b) { if (b && b.offsetParent !== null) { b.click(); clicked = true; } });
                });
            }
            if (!clicked) {
                var btn = document.getElementById('comment-load-more');
                if (btn) { btn.textContent = '暂无更多或由评论组件自动加载'; btn.disabled = true; }
            }
        }
        (function () {
            // 评论组件可能异步渲染，延迟隐藏无用按钮
            setTimeout(function () {
                var selectors = ['.tk-load-more', '.atk-load-more', '.wl-more', '#load-more', '.comment-load-more'];
                var has = selectors.some(function (sel) { return document.querySelector(sel) !== null; });
                var btn = document.getElementById('comment-load-more');
                if (btn && !has) btn.style.display = 'none';
            }, 2000);
        })();
    </script>
</th:block>
