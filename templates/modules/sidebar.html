<!-- 侧栏，主要是手机端时会使用 -->
<div id="sidebar">
    <div id="menu-mask"></div>
    <div id="sidebar-menus">
        <span class="sidebar-menu-item-title">功能</span>
        <div class="sidebar-menu-item">
            <a class="darkmode_switchbutton menu-child" href="javascript:void(0);" onclick="rm.switchDarkMode()"
               rel="external nofollow" title="显示模式切换">
                <i class="haofont hao-icon-moon" style="font-size: 0.9rem;"></i>
                <span>显示模式</span>
            </a>
        </div>
        <th:block th:if="${not #strings.isEmpty(theme.config.nav.leftMenu) && theme.config.nav.menus.phone_leftMenu}"
                  th:with="leftMenu = ${menuFinder.getByName(theme.config.nav.leftMenu)}">
            <div class="back-menu-list-groups">
                <div class="back-menu-list-group" th:each="menuItem : ${leftMenu.menuItems}"
                     th:if="${not #lists.isEmpty(menuItem.children)}">
                    <div class="back-menu-list-title" th:text="${menuItem.status.displayName}"></div>
                    <div class="back-menu-list">
                        <a class="back-menu-item" rel="external nofollow"
                           th:each="childMenu : ${menuItem.children}"
                           th:with="icon=${#annotations.getOrDefault(childMenu, 'icon', '')}"
                           th:target="${childMenu.spec.target?.value}"
                           th:href="@{${childMenu.status.href}}">
                            <th:block th:if="${!#strings.isEmpty(icon)}">
                                <img th:if="${#strings.startsWith(icon, 'http') or #strings.startsWith(icon, '/') or #strings.startsWith(icon, 'data:')}"
                                     class="back-menu-item-icon" width="24" height="24" alt="菜单图标"
                                     th:src="${icon}">
                                <i th:if="${!#strings.startsWith(icon, 'http') and !#strings.startsWith(icon, '/') and !#strings.startsWith(icon, 'data:') and !#strings.startsWith(icon, '#')}"
                                   class="back-menu-item-icon" th:classappend="${icon}" aria-hidden="true"></i>
                            </th:block>
                            <span class="back-menu-item-text" th:text="${childMenu.status.displayName}"></span>
                        </a>
                    </div>
                </div>
                <th:block th:each="menuItem : ${leftMenu.menuItems}" th:if="${#lists.isEmpty(menuItem.children)}">
                    <a class="back-menu-bottom-btn" rel="external nofollow"
                       th:target="${menuItem.spec.target?.value}"
                       th:href="@{${menuItem.status.href}}"
                       th:title="${menuItem.status.displayName}">
                        <span class="back-menu-bottom-btn-text" th:text="${menuItem.status.displayName}"></span>
                    </a>
                </th:block>
            </div>
        </th:block>
        <th:block th:if="${not #lists.isEmpty(menuFinder.getPrimary().menuItems) && theme.config.nav.menus.phone_menu}"
        >
            <div class="menus_items">
                <div class="menus_item" th:each="menuItem : ${menuFinder.getPrimary().menuItems}">
                    <th:block th:if="${not #lists.isEmpty(menuItem.children)}">
                        <a class="site-page" href="javascript:void(0);" rel="external nofollow">
                            <span th:text="${menuItem.status.displayName}"></span>
                        </a>
                        <th:block th:if="${not #lists.isEmpty(menuItem.children)}">
                            <ul class="menus_item_child">
                                <li th:each="childMenu : ${menuItem.children}">
                                    <a class="site-page child" th:href="@{${childMenu.status.href}}">
                                        <th:block th:if="${!theme.config.nav.menus.enable_ali_iconfont_symbol_header}">
                                            <i th:if="${!#strings.isEmpty(#annotations.getOrDefault(childMenu, 'icon', ''))}"
                                               th:class="${#annotations.getOrDefault(childMenu, 'icon', '')}"></i>
                                        </th:block>
                                        <th:block th:if="${theme.config.nav.menus.enable_ali_iconfont_symbol_header}">
                                            <svg class="ali_icon" aria-hidden="true">
                                                <use th:href="${#annotations.getOrDefault(childMenu, 'icon','jiewen joe-icon-zuzhijiagou')}"></use>
                                            </svg>
                                        </th:block>
                                        <span th:text="${childMenu.status.displayName}"></span>
                                    </a>
                                </li>
                            </ul>
                        </th:block>
                    </th:block>
                </div>
            </div>
        </th:block>
        <span class="sidebar-menu-item-title">标签</span>
        <!-- tagQuantity 为 null/0 时用 listAll，避免 list(1,null/0) 抛错截断 HTML 导致白屏 -->
        <div class="card-widget card-tags card-archives card-webinfo card-allinfo"
             th:with="tagLimit=${theme.config.sidebar != null ? theme.config.sidebar.tagQuantity : 0},
                      tags=${tagLimit != null and tagLimit > 0 ? tagFinder.list(1, tagLimit) : tagFinder.listAll()}">
            <div class="item-headline"></div>
            <div class="card-tag-cloud">
                <a class="tag-item" style="font-size:1em"
                   th:each="tag : ${tags}"
                   th:href="@{${tag.status.permalink}}"
                   th:title="${tag.spec.displayName}">
                    [[${tag.spec.displayName}]]<sup th:text="${tag.status.visiblePostCount}"></sup>
                </a>
            </div>
        </div>
    </div>
</div>
