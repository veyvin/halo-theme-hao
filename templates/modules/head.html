<!-- 公共的 head 部分，可以定义部分 links,scripts,styles -->
<th:block th:fragment="head(htmlType)">
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <meta content="telephone=no" name="format-detection">
    <meta content="var(--heo-card-bg)" name="theme-color">
    <!-- description / keywords / favicon / generator / robots 由 Halo 自动注入，主题不再重复输出 -->
    <!-- canonical + Open Graph + Twitter Card：Halo 未统一生成，由主题按开关提供 -->
    <th:block th:if="${theme.config.basics.seo.enable_metadata}">
        <!-- 文章页 -->
        <th:block th:if="${htmlType == 'post' && post != null}">
            <link rel="canonical" th:href="@{${site.url + post.status.permalink}}"/>
            <meta property="og:type" content="article"/>
            <meta property="og:title" th:content="${post.spec.title}"/>
            <meta property="og:url" th:content="${site.url + post.status.permalink}"/>
            <meta property="og:description" th:content="${post.status.excerpt}"/>
            <meta property="og:image" th:if="${post.spec.cover ?: site.logo ?: theme.config.other.opengraph.image}"
                  th:content="${post.spec.cover ?: site.logo ?: theme.config.other.opengraph.image}"/>
            <meta name="twitter:card" content="summary_large_image"/>
            <meta name="twitter:title" th:content="${post.spec.title}"/>
            <meta name="twitter:description" th:content="${post.status.excerpt}"/>
            <meta name="twitter:image" th:if="${post.spec.cover ?: site.logo ?: theme.config.other.opengraph.image}"
                  th:content="${post.spec.cover ?: site.logo ?: theme.config.other.opengraph.image}"/>
        </th:block>
        <!-- 独立页面（含自定义页面模板，变量为 singlePage） -->
        <th:block th:if="${htmlType == 'page' && singlePage != null}">
            <link rel="canonical" th:href="@{${site.url + singlePage.status.permalink}}"/>
            <meta property="og:type" content="article"/>
            <meta property="og:title" th:content="${singlePage.spec.title}"/>
            <meta property="og:url" th:content="${site.url + singlePage.status.permalink}"/>
            <meta property="og:description" th:content="${singlePage.status.excerpt}"/>
            <meta property="og:image" th:if="${site.logo ?: theme.config.other.opengraph.image}"
                  th:content="${site.logo ?: theme.config.other.opengraph.image}"/>
            <meta name="twitter:card" content="summary_large_image"/>
            <meta name="twitter:title" th:content="${singlePage.spec.title}"/>
            <meta name="twitter:description" th:content="${singlePage.status.excerpt}"/>
            <meta name="twitter:image" th:if="${site.logo ?: theme.config.other.opengraph.image}"
                  th:content="${site.logo ?: theme.config.other.opengraph.image}"/>
        </th:block>
        <!-- 站点级页面（首页 / 归档 / 分类 / 标签 / 作者）：只输出基础分享信息 -->
        <th:block th:if="${htmlType != 'post' && !(htmlType == 'page' && singlePage != null)}">
            <meta property="og:type" content="website"/>
            <meta property="og:title" th:content="${siteTitle}"/>
            <meta property="og:image" th:if="${site.logo ?: theme.config.other.opengraph.image}"
                  th:content="${site.logo ?: theme.config.other.opengraph.image}"/>
            <meta name="twitter:card" content="summary_large_image"/>
            <meta name="twitter:title" th:content="${siteTitle}"/>
            <meta name="twitter:image" th:if="${site.logo ?: theme.config.other.opengraph.image}"
                  th:content="${site.logo ?: theme.config.other.opengraph.image}"/>
        </th:block>
    </th:block>
    <style th:if="${not #strings.isEmpty(theme.config.style.fontFamily)}" th:utext="|body{font-family:${theme.config.style.fontFamily}}|"></style>
    <title th:text="${siteTitle}"></title>
    <!-- favicon 由 Halo 按系统设置自动注入，主题不再重复输出 -->

    <!-- jQuery 为 body 尾部同步脚本（blogex/rightmenu 顶层直接用 $）的前置依赖，必须同步加载 -->
    <script th:src="${assets_link + '/libs/jquery/jquery.min.js'}"></script>

    <!-- perf-2: defer 非首屏关键脚本；首屏主题切换逻辑已内联在下方（带 heo 存在性守卫），defer 脚本就绪后会补调 initThemeColor -->
    <script defer th:src="${assets_link + '/js/heo.js' + theme_version}"></script>

    <link rel="stylesheet" th:href="${assets_link + '/zhheo/zhheoblog.css' + theme_version}">

    <link rel="stylesheet" th:href="${assets_link + '/zhheo/custom.css' + theme_version}">

    <link rel="stylesheet" th:href="${assets_link + '/zhheo/commentBarrage.css'}">

    <link rel="stylesheet" th:href="${assets_link + '/css/hao-canvas.css' + theme_version}">

    <script defer th:if="${theme.config.post.aiAssistantEnable}" th:src="${assets_link + '/js/hao-ai.js' + theme_version}"></script>

    <style th:if="${theme.config.other.scrollbarLinearGradientEnable}">
        *::-webkit-scrollbar-thumb {
            background-color: var(--heo-main);
            background-image: -webkit-linear-gradient(45deg,rgba(255,255,255,.4) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.4) 50%,rgba(255,255,255,.4) 75%,transparent 75%,transparent);
            border-radius: 2em
        }
    </style>

    <!-- swiper 仅瞬间插件存在时加载（perf-5：未安装时 fallback 用 CSS 轮换，省 144KB+CSS） -->
    <link th:if="${theme.config.top.moment && pluginFinder.available('PluginMoments')}" rel="stylesheet" th:href="${assets_link + '/libs/swiper/swiper-bundle.min.css'}"/>
    
    <!-- 右下角通知 -->
    <link th:href="${assets_link + '/libs/node-snackbar/snackbar.min.css'}"
          media="print"
          onload='this.media="all"'
          rel="stylesheet"
    />

    <!-- perf-4: 代码高亮按需加载：仅文章/页面且正文含代码块时加载（首页省 ~850KB） -->
    <th:block th:if="${(htmlType == 'post' && #strings.contains(post.content.content, '<pre')) ||
                        (htmlType == 'page' && #strings.contains(singlePage.content.content, '<pre'))}">
        <!-- 代码块自动识别语言 -->
        <th:block th:replace="~{modules/common/code}"/>
        <!--  代码块-->
        <th:block th:replace="~{macro/prism-code}"/>
    </th:block>

    <!-- 页脚内容-样式一 -->
    <th:block th:replace="~{modules/common/footer-style-one}"/>

    <script>
        (win => {
            win.saveToLocal = {
                set: function setWithExpiry(key, value, ttl) {
                    if (ttl === 0) return
                    const now = new Date()
                    const expiryDay = ttl * 86400000
                    const item = {
                        value: value,
                        expiry: now.getTime() + expiryDay,
                    }
                    localStorage.setItem(key, JSON.stringify(item))
                },

                get: function getWithExpiry(key) {
                    const itemStr = localStorage.getItem(key)

                    if (!itemStr) {
                        return undefined
                    }
                    const item = JSON.parse(itemStr)
                    const now = new Date()

                    if (now.getTime() > item.expiry) {
                        localStorage.removeItem(key)
                        return undefined
                    }
                    return item.value
                }
            }

            win.getScript = url => new Promise((resolve, reject) => {
                const script = document.createElement('script')
                script.src = url
                script.async = true
                script.onerror = reject
                script.onload = script.onreadystatechange = function () {
                    const loadState = this.readyState
                    if (loadState && loadState !== 'loaded' && loadState !== 'complete') return
                    script.onload = script.onreadystatechange = null
                    resolve()
                }
                document.head.appendChild(script)
            })

            win.getCSS = (url,id = false) => new Promise((resolve, reject) => {
                const link = document.createElement('link')
                link.rel = 'stylesheet'
                link.href = url
                if (id) link.id = id
                link.onerror = reject
                link.onload = link.onreadystatechange = function() {
                    const loadState = this.readyState
                    if (loadState && loadState !== 'loaded' && loadState !== 'complete') return
                    link.onload = link.onreadystatechange = null
                    resolve()
                }
                document.head.appendChild(link)
            })

            win.activateDarkMode = function () {
                document.documentElement.setAttribute('data-theme', 'dark')
                document.documentElement.classList.add('color-scheme-dark')
                if (typeof heo !== 'undefined' && heo.initThemeColor) heo.initThemeColor()
            }
            win.activateLightMode = function () {
                document.documentElement.setAttribute('data-theme', 'light')
                document.documentElement.classList.remove('color-scheme-dark')
                if (typeof heo !== 'undefined' && heo.initThemeColor) heo.initThemeColor()
            }
            const t = saveToLocal.get('theme')

            const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches
            const isLightMode = window.matchMedia('(prefers-color-scheme: light)').matches
            const isNotSpecified = window.matchMedia('(prefers-color-scheme: no-preference)').matches
            const hasNoSupport = !isDarkMode && !isLightMode && !isNotSpecified

            if (t === undefined) {
                if (isLightMode) activateLightMode()
                else if (isDarkMode) activateDarkMode()
                else if (isNotSpecified || hasNoSupport) {
                    const now = new Date()
                    const hour = now.getHours()
                    const isNight = hour <= 6 || hour >= 18
                    isNight ? activateDarkMode() : activateLightMode()
                }
                window.matchMedia('(prefers-color-scheme: dark)').addListener(function (e) {
                    if (saveToLocal.get('theme') === undefined) {
                        e.matches ? activateDarkMode() : activateLightMode()
                    }
                })
            } else if (t === 'light') activateLightMode()
            else activateDarkMode()

            if("[[${theme.config.style.colorScheme}]]" === 'dark')
                activateDarkMode()
            if("[[${theme.config.style.colorScheme}]]" === 'light')
                activateLightMode()

            const asideStatus = saveToLocal.get('aside-status')
            if (asideStatus !== undefined) {
                if (asideStatus === 'hide') {
                    document.documentElement.classList.add('hide-aside')
                } else {
                    document.documentElement.classList.remove('hide-aside')
                }
            }
        })(window)
    </script>

    <!-- 动态加载条 -->
    <script data-pace-options="{ &quot;restartOnRequestAfter&quot;:false,&quot;eventLag&quot;:false}"
            th:src="${assets_link + '/libs/pace/pace.min.js'}"
            th:if="${theme.config.other.loadingBoxs.loadProgressBar}">
    </script>

    <!-- 复制 https://githubfast.com/zenorocha/clipboard.js -->
    <script th:src="${assets_link + '/libs/clipboard/clipboard.min.js'}"></script>

    <!-- icon图标 -->
    <link rel="stylesheet" th:href="${assets_link + '/icon/iconfont.css' + theme_version}">

    <th:block th:replace="~{modules/variables/site-config}" />


</th:block>
