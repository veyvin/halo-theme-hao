<!-- 标签：与 bar/tag 一致用 list(1,30)，避免 tagQuantity 为 null/0 时抛错截断页面 -->
<th:block th:with="tags=${tagFinder.list(1,30)}">

    <div class="item-headline"></div>
    <div class="card-tag-cloud">
        <a class="tag-item" style="font-size:1em"
           th:each="tag : ${tags}"
           th:href="@{${tag.status.permalink}}"
           th:title="${tag.spec.displayName}">
            <th:block th:text="${tag.spec.displayName}"></th:block><sup th:text="${tag.status.visiblePostCount}"></sup>
        </a>
    </div>
    <script th:if="${theme.config.other.tagRandomColorEnable}">
        for (const tag of document.getElementsByClassName('tag-item')) {
            let randomColor ="#"+((1<<24)*Math.random()|0).toString(16);
            tag.style.color = randomColor;
        }
    </script>

</th:block>
