<!-- 导航栏左侧 -->
<div id="blog_name" >

    <th:block th:if="${not #strings.isEmpty(theme.config.nav.leftMenu) && theme.config.nav.menus.pc_leftMenu}"
              th:with="leftMenu = ${menuFinder.getByName(theme.config.nav.leftMenu)}">
        <!-- 菜单栏左侧按钮，没有配置时，则不展示-->
        <div class="back-home-button" tabindex="-1"
             th:if="${not #lists.isEmpty(leftMenu)}">

            <i class="back-home-button-icon haofont hao-icon-apps-fill" style="font-size: 1rem"></i>
            <div class="back-menu-list-groups">
                <div class="back-menu-list-group" th:each="menuItem : ${leftMenu.menuItems}"
                     th:if="${not #lists.isEmpty(menuItem.children)}">
                    <div class="back-menu-list-title" th:text="${menuItem.status.displayName}"></div>
                    <div class="back-menu-list">
                        <th:block th:each="childMenu : ${menuItem.children}">
                            <a class="back-menu-item" rel="external nofollow"
                               th:target="${childMenu.spec.target?.value}" th:href="@{${childMenu.status.href}}">
                                <!-- icon 预留 -->
                                <img th:if="${!#strings.isEmpty(#annotations.getOrDefault(childMenu, 'icon', ''))}"
                                     class="back-menu-item-icon" width="20" height="20" alt="菜单图标"
                                     th:src="${#annotations.getOrDefault(childMenu, 'icon', '')}">
                                <span class="back-menu-item-text" th:text="${childMenu.status.displayName}"></span>
                            </a>
                        </th:block>
                    </div>
                </div>
                <th:block th:each="menuItem : ${leftMenu.menuItems}" th:if="${#lists.isEmpty(menuItem.children)}">
                    <a class="back-menu-bottom-btn" rel="external nofollow"
                       th:target="${menuItem.spec.target?.value}" th:href="@{${menuItem.status.href}}"
                       th:title="${menuItem.status.displayName}">
                        <img th:if="${!#strings.isEmpty(#annotations.getOrDefault(menuItem, 'icon', ''))}"
                             class="back-menu-bottom-btn-icon" width="20" height="20" alt="菜单图标"
                             th:src="${#annotations.getOrDefault(menuItem, 'icon', '')}">
                        <span class="back-menu-bottom-btn-text" th:text="${menuItem.status.displayName}"></span>
                    </a>
                </th:block>
            </div>
        </div>
    </th:block>
    <!-- 返回主页 -->
    <!-- 这里可以指定使用什么作为图标，默认使用站点名称 -->
    <a href="/" id="site-name" title="返回博客主页">
        <span th:utext="${#strings.isEmpty(theme.config.basics.siteTitle)} ? ${site.title} : ${theme.config.basics.siteTitle}"></span>
    </a>
    <style type="text/css">
        .back-home-button .back-menu-bottom-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 8px 12px 12px;
            padding: 8px;
            border-radius: 8px;
            background: var(--heo-main-op, rgba(66, 90, 239, .1));
            color: var(--heo-fontcolor);
            font-size: 14px;
        }

        .back-home-button .back-menu-bottom-btn:hover {
            background: var(--heo-main);
            color: #fff;
        }

        .back-home-button .back-menu-bottom-btn-icon {
            width: 20px;
            height: 20px;
            border-radius: 6px;
        }
    </style>
</div>
