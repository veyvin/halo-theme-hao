<!-- 目录条，这里使用和 category-bar 同样的 css -->
<div id="category-bar">
    <div class="category-bar-items" id="category-bar-items">
        <div class="category-bar-item select" id="category-bar-home">
            <a href="/">首页</a>
        </div>

        <th:block th:replace="~{modules/bar/fixed-items :: fixed-items}" />

        <!-- perf-10：标签可能上百，bar 只取前 30 个，全量页走 /tags -->
        <th:block th:with="tags = ${tagFinder.list(1,30)}">

            <div class="category-bar-item"
                 th:each="tagItem : ${tags.items}"
                 th:id="${tagItem.spec.displayName}">
                <a th:href="@{${tagItem.status.permalink}}" th:text="${tagItem.spec.displayName}"></a>
            </div>

        </th:block>
    </div>
    <a class="category-bar-more" th:replace="~{modules/bar/more}">更多</a>
</div>
