<div class="bbTimeList container" id="bbTimeList"
     th:if="${theme.config.top.moment}">

    <i class="haofont hao-icon-logo-moment" onclick="" style="font-size: 1.3rem;" title="瞬间"></i>

    <!--   未安装插件（perf-5：无 swiper，CSS 淡入淡出轮换提示，省 144KB）   -->
    <th:block th:if="!${pluginFinder.available('PluginMoments')}">
        <div class="swiper-container swiper-no-swiping moment-fallback" id="bbtalk" tabindex="-1">
            <div class="swiper-wrapper" id="bber-talk"
                 onclick="location.href=location.href='https\:\/\/github.com/halo-sigs/plugin-moments'">
                <div class="li-style swiper-slide moment-fallback-item">这里需要安装瞬间的插件</div>
                <div class="li-style swiper-slide moment-fallback-item">去安装吧！</div>
            </div>
        </div>
        <i class="bber-gotobb haofont hao-icon-circle-arrow-right"
           onclick="location.href=location.href='https\:\/\/github.com/halo-sigs/plugin-moments'" title="下载插件"></i>
        <style>
            #bbtalk.moment-fallback .swiper-wrapper { position: relative; display: block; }
            #bbtalk.moment-fallback .moment-fallback-item { animation: moment-fallback-swap 6s infinite; }
            #bbtalk.moment-fallback .moment-fallback-item:nth-child(2) {
                position: absolute; inset: 0; animation-delay: 3s; opacity: 0;
            }
            @keyframes moment-fallback-swap { 0%,45% { opacity: 1; } 50%,95% { opacity: 0; } 100% { opacity: 1; } }
            #bbtalk.moment-fallback .moment-fallback-item:nth-child(2) { animation-name: moment-fallback-swap-b; }
            @keyframes moment-fallback-swap-b { 0%,45% { opacity: 0; } 50%,95% { opacity: 1; } 100% { opacity: 0; } }
        </style>
    </th:block>

    <!--   瞬间插件   -->
    <th:block th:if="${pluginFinder.available('PluginMoments')}">
        <div class="swiper-container swiper-no-swiping" id="bbtalk" tabindex="-1">
            <div class="swiper-wrapper" id="bber-talk" th:attr="onclick='pjax.loadUrl(\''+ @{/moments} +'\')'" th:if="${momentFinder}">
                <th:block th:each="moment : ${momentFinder.listAll()}" th:with="content=${moment.spec.content}">
                    <div class="li-style swiper-slide"
                         th:if="${not #strings.isEmpty(content.raw)}"
                         th:utext="${content.raw}">
                    </div>
                </th:block>
            </div>
        </div>
        <i class="bber-gotobb haofont hao-icon-circle-arrow-right" onclick="location.href='/moments'" title="查看全文"></i>
    </th:block>

</div>
