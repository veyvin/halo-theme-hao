<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{modules/layouts/layout :: layout(content = ~{::content}, htmlType = 'page',title = #{page.friends.title} + ' | ' + ${site.title}, head = ~{::head})}">

<th:block th:fragment="head">
    <!-- 分离CSS文件 -->
    <link rel="stylesheet" th:href="@{/assets/css/fmoments.css}" data-pjax>
</th:block>

<th:block th:fragment="content">
    <div class="page" id="body-wrap">
        <!-- 头部导航栏 -->
        <header class="not-top-img" id="page-header">
            <nav th:replace="~{modules/nav :: nav(title = #{page.friends.title})}"></nav>
        </header>

        <main class="layout hide-aside" id="content-inner">
            <div id="page">
                <!-- 朋友圈统计信息面板 -->
                <div id="fMomentsMessageBoard">
                    <div class="fMomentsUpdatedTime">
                        <i class="fas fa-sync-alt"></i>
                        <th:block th:utext="${#messages.msg('friends.lastUpdated')}"></th:block>
                        <span id="lastUpdateTime" th:utext="${#messages.msg('friends.loading')}"></span>
                    </div>

                    <div class="fMomentsStatsGrid">
                        <div class="fMomentsStatCard">
                            <div class="fMomentsStatIcon">📚</div>
                            <div class="fMomentsStatNumber" id="totalArticles">0</div>
                            <div class="fMomentsStatLabel">总文章数</div>
                        </div>

                        <div class="fMomentsStatCard">
                            <div class="fMomentsStatIcon">👥</div>
                            <div class="fMomentsStatNumber" id="totalAuthors">0</div>
                            <div class="fMomentsStatLabel">活跃作者</div>
                        </div>

                        <div class="fMomentsStatCard">
                            <div class="fMomentsStatIcon">🔥</div>
                            <div class="fMomentsStatNumber" id="todayCount">0</div>
                            <div class="fMomentsStatLabel">今日更新</div>
                        </div>

                        <div class="fMomentsStatCard">
                            <div class="fMomentsStatIcon">⚡</div>
                            <div class="fMomentsStatNumber" id="weekCount">0</div>
                            <div class="fMomentsStatLabel">本周更新</div>
                        </div>
                    </div>
                </div>

                <!-- 控制面板 -->
                <div class="fMomentsControlPanel">
                    <!-- P2-4：i18n 文本通过 data-i18n 注入，JS 读取避免硬编码 -->
                    <div class="fMomentsSearchBox" data-i18n-search="${#messages.msg('friends.searchPlaceholder')}">
                        <i class="fas fa-search fMomentsSearchIcon"></i>
                        <input type="text" class="fMomentsSearchInput"
                               th:placeholder="${#messages.msg('friends.searchPlaceholder')}" id="searchInput">
                    </div>

                    <div class="fMomentsFilterGroup">
                        <select class="fMomentsSelect" id="authorFilter">
                            <option value="" th:text="${#messages.msg('friends.allAuthors')}"></option>
                        </select>

                        <select class="fMomentsSelect" id="sortSelect">
                            <option value="pubDate" th:text="${#messages.msg('friends.sortPubDate')}"></option>
                            <option value="creationTime" th:text="${#messages.msg('friends.sortCreationTime')}"></option>
                            <option value="author" th:text="${#messages.msg('friends.sortAuthor')}"></option>
                            <option value="title" th:text="${#messages.msg('friends.sortTitle')}"></option>
                        </select>

                        <div class="fMomentsToggle">
                            <span th:text="${#messages.msg('friends.ascending')}"></span>
                            <div class="fMomentsSwitch active" id="sortOrderSwitch"></div>
                            <span th:text="${#messages.msg('friends.descending')}"></span>
                        </div>
                    </div>
                </div>

                <!-- 显示数量状态 -->
                <div class="fMomentsDisplayStatus">
                    <div class="fMomentsDisplayInfo">
                        <i class="fas fa-filter"></i>
                        <span>显示</span>
                        <span class="fMomentsDisplayCount" id="displayedCount">0</span>
                        <span>/</span>
                        <span class="fMomentsDisplayCount" id="totalCount">0</span>
                        <span th:text="${#messages.msg('friends.foundCountSuffix')}"></span>
                    </div>
                    <div class="fMomentsDisplayInfo" id="filterStatus" style="display: none;">
                        <i class="fas fa-info-circle"></i>
                        <span id="filterText" th:text="${#messages.msg('friends.filterApplied')}"></span>
                    </div>
                </div>

                <!-- 加载状态 -->
                <div id="loadingIndicator" class="fMomentsLoading">
                    <div class="fMomentsLoadingSpinner"></div>
                    <div class="fMomentsLoadingText" th:text="${#messages.msg('friends.loadingContent')}"></div>
                </div>

                <!-- 朋友圈文章容器 -->
                <div id="fmomentsContainer"
                     data-i18n-all-authors="${#messages.msg('friends.allAuthors')}"
                     data-i18n-filter-applied="${#messages.msg('friends.filterApplied')}"
                     data-i18n-loading="${#messages.msg('friends.loadingContent')}"
                     data-i18n-retry="${#messages.msg('friends.retry')}"
                     data-i18n-error="${#messages.msg('friends.loadFail')}"
                     data-i18n-network-fail="${#messages.msg('friends.networkFail')}"
                     data-i18n-http-error="${#messages.msg('friends.httpError')}"></div>

                <!-- 加载更多按钮 -->
                <div id="loadingStatus" style="display: none;">
                    <button id="fmomentsMoreBtn" type="button">
                        <i class="fas fa-angle-double-down"></i>
                        <span th:text="${#messages.msg('friends.loadMore')}"></span>
                    </button>
                    <div class="fMomentsNoMore" id="noMoreTip" style="display: none;">
                        <i class="fas fa-check-circle"></i>
                        <div th:text="${#messages.msg('friends.allShown')}"></div>
                        <small><span th:text="${#messages.msg('friends.foundCountPrefix')}"></span><span id="finalCount">0</span><span th:text="${#messages.msg('friends.foundCountSuffix')}"></span></small>
                    </div>
                </div>

                <!-- 错误状态 -->
                <div class="fMomentsErrorState" id="errorState" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3 th:text="${#messages.msg('friends.loadFail')}"></h3>
                    <div id="errorMessage" th:text="${#messages.msg('friends.checkNetwork')}"></div>
                    <button class="fMomentsRetryBtn" id="retryBtn" th:text="${#messages.msg('friends.retry')}"></button>
                </div>

                <!-- 空状态 -->
                <div class="fMomentsEmptyState" id="emptyState" style="display: none;">
                    <i class="fas fa-search"></i>
                    <h3 th:text="${#messages.msg('friends.noPosts')}"></h3>
                    <p th:utext="${#messages.msg('friends.noResults')}"></p>
                </div>
            </div>
        </main>

        <!-- 底部 -->
        <footer th:replace="~{modules/footer}" />

        <!-- 资源检查和动态加载脚本 -->
        <script data-pjax th:inline="javascript">
            // 资源动态加载器
            window.MomentsResourceLoader = {
                // 检查CSS是否已加载
                isCSSLoaded: function (href) {
                    const links = document.getElementsByTagName('link');
                    for (let i = 0; i < links.length; i++) {
                        if (links[i].href && links[i].href.includes(href)) {
                            return true;
                        }
                    }
                    return false;
                },

                // 检查JS是否已加载
                isJSLoaded: function (src) {
                    const scripts = document.getElementsByTagName('script');
                    for (let i = 0; i < scripts.length; i++) {
                        if (scripts[i].src && scripts[i].src.includes(src)) {
                            return true;
                        }
                    }
                    // 也检查是否已经定义了相关的全局变量/函数
                    return typeof FriendMomentsApp !== 'undefined';
                },

                // 动态加载CSS
                loadCSS: function (href) {
                    return new Promise((resolve, reject) => {
                        if (this.isCSSLoaded(href)) {
                            // console.log('CSS already loaded:', href);
                            resolve();
                            return;
                        }

                        const link = document.createElement('link');
                        link.rel = 'stylesheet';
                        link.href = href;
                        link.setAttribute('data-pjax', '');

                        link.onload = () => {
                            // console.log('CSS loaded successfully:', href);
                            resolve();
                        };

                        link.onerror = () => {
                            console.error('Failed to load CSS:', href);
                            reject(new Error(`Failed to load CSS: ${href}`));
                        };

                        document.head.appendChild(link);
                    });
                },

                // 动态加载JS
                loadJS: function (src) {
                    return new Promise((resolve, reject) => {
                        if (this.isJSLoaded(src)) {
                            // console.log('JS already loaded:', src);
                            resolve();
                            return;
                        }

                        const script = document.createElement('script');
                        script.src = src;
                        script.setAttribute('data-pjax', '');

                        script.onload = () => {
                            // console.log('JS loaded successfully:', src);
                            resolve();
                        };

                        script.onerror = () => {
                            console.error('Failed to load JS:', src);
                            reject(new Error(`Failed to load JS: ${src}`));
                        };

                        document.head.appendChild(script);
                    });
                },

                // 加载所有必需的资源
                loadRequiredResources: async function () {
                    const cssPath = /*[[@{/assets/css/fmoments.css}]]*/ '/assets/css/fmoments.css';
                    const jsPath = /*[[@{/assets/js/fmoments.js}]]*/ '/assets/js/fmoments.js';

                    try {
                        // console.log('Checking and loading required resources...');

                        // 并行加载CSS和JS
                        await Promise.all([
                            this.loadCSS(cssPath),
                            this.loadJS(jsPath)
                        ]);

                        // console.log('All resources loaded successfully');
                        return true;
                    } catch (error) {
                        console.error('Error loading resources:', error);
                        return false;
                    }
                }
            };
        </script>
        <!-- 初始化脚本 -->
        <script data-pjax th:inline="javascript">
            // 朋友圈配置
            window.fmomentsConfig = {
                apiUrl: '/apis/api.friend.moony.la/v1alpha1/friendposts',
                pageSize: 12,
                errorImg: /*[[${theme.config.other.error_404.background}]]*/ '/assets/images/404.gif'
            };

            // 全局初始化状态追踪
            window._momentsInitializing = false;

            // P2-4：i18n 文本注入给 FriendMomentsApp，避免 JS 硬编码
            window.fmI18n = (function(){
                var c = document.getElementById('fmomentsContainer');
                return c ? {
                    allAuthors: c.getAttribute('data-i18n-all-authors') || '全部作者',
                    filterApplied: c.getAttribute('data-i18n-filter-applied') || '已应用筛选条件',
                    loading: c.getAttribute('data-i18n-loading') || '正在加载动态内容...',
                    retry: c.getAttribute('data-i18n-retry') || '重新加载',
                    error: c.getAttribute('data-i18n-error') || '加载失败',
                    networkFail: c.getAttribute('data-i18n-network-fail') || '网络连接失败，请检查网络后重试',
                    httpError: c.getAttribute('data-i18n-http-error') || '服务器错误'
                } : {};
            })();
            async function initMomentsApp() {
                // 防止并发初始化
                if (window._momentsInitializing) {
                    // console.log('Moments initialization already in progress');
                    return;
                }

                // console.log('Starting Moments initialization');
                window._momentsInitializing = true;

                try {
                    // 首先检查并加载必需的资源
                    const resourcesLoaded = await window.MomentsResourceLoader.loadRequiredResources();

                    if (!resourcesLoaded) {
                        console.error('Failed to load required resources');
                        return;
                    }

                    // 等待一小段时间确保资源完全加载
                    await new Promise(resolve => setTimeout(resolve, 100));

                    // 检查FriendMomentsApp是否可用
                    if (typeof FriendMomentsApp !== 'undefined') {
                        // 创建新实例（构造函数会处理旧实例的清理）
                        window.fMomentsApp = new FriendMomentsApp();
                        // 显式调用初始化
                        await window.fMomentsApp.init();
                        // console.log('FriendMomentsApp initialized successfully');
                    } else {
                        console.error('FriendMomentsApp is not available after loading resources');
                    }
                } catch (error) {
                    console.error('Error initializing FriendMomentsApp:', error);
                } finally {
                    window._momentsInitializing = false;
                }
            }

            // PJAX开始时立即清理
            document.addEventListener('pjax:start', function () {
                // console.log('PJAX start - cleaning up Moments');
                if (window._momentsInstance) {
                    window._momentsInstance.destroy();
                }
                window._momentsInitializing = false;
            });

            // DOM加载完成后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initMomentsApp);
            } else {
                // DOM已经加载完成
                initMomentsApp();
            }

            // PJAX完成后重新初始化
            document.addEventListener('pjax:complete', function () {
                if (document.getElementById('fmomentsContainer')) {
                    // 延迟一点时间确保DOM稳定
                    setTimeout(initMomentsApp, 150);
                }
            });
        </script>

    </div>
</th:block>

</html>
