<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layouts/layout :: layout(content = ~{::content}, htmlType = 'category',title = #{page.categories.title} + ' | ' + ${site.title}, head = ~{::head})}">
<th:block th:fragment="head">
</th:block>
<th:block th:fragment="content">

    <div class="page" id="body-wrap">
        <header class="not-top-img" id="page-header">
            <nav th:replace="~{modules/nav :: nav(title = #{page.categories.title})}"></nav>
        </header>
        <main class="layout hide-aside" id="content-inner">

            <div id="page">
                <h1 class="page-title" th:text="${#messages.msg('page.title.category')}">分类</h1>
                <div th:if="${#strings.equals(theme.config.categories.use, 'default')}" class="category-sections"
                     th:with="allCats=${categoryFinder.listAll()},stats=${siteStatsFinder.getStats()}">
                    <th:block th:if="${#lists.isEmpty(allCats)}">
                        <th:block th:replace="~{modules/common/empty-state :: empty-state('page.categories.title', '', 'fas fa-folder', 'empty-state')}"></th:block>
                    </th:block>
                    <div class="category-stats">
                        查看不同领域的 <a th:href="@{${site.routes.categoriesUri}}" th:text="${#lists.size(allCats)}"></a> 个分类，
                        共 <a th:href="@{${site.routes.archivesUri}}" th:text="${stats.post}"></a> <span th:text="${#messages.msg('page.archives.posts')}"></span>
                    </div>
                    <section class="category-section" th:each="categoryItem : ${allCats}">
                        <h2 class="category-section-title">
                            <a th:href="@{${categoryItem.status.permalink}}"
                               th:text="${categoryItem.spec.displayName}"></a>
                            <span class="category-section-count"
                                  th:text="${categoryItem.status.visiblePostCount}"></span>
                        </h2>
                        <ul class="category-post-list"
                            th:with="catPosts=${postFinder.list({page: 1, size: theme.config.categories.listNum, sort: {'spec.publishTime,desc'}, categoryName: categoryItem.metadata.name})}">
                            <li th:each="post : ${catPosts}">
                                <a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}"
                                   th:title="${post.spec.title}"></a>
                                <time th:text="${#dates.format(post.spec.publishTime,'yyyy-MM-dd')}"></time>
                            </li>
                        </ul>
                        <a class="category-more" th:href="@{${categoryItem.status.permalink}}">进入分类 →</a>
                    </section>
                </div>
                <th:block th:if="${#strings.equals(theme.config.categories.use, '3D')}">
                    <link rel="stylesheet" th:href="${assets_link + '/libs/no3d/no3d.css'}">
                    <div id="libCategories" >
                        <div id="lib-cards" class="container" >
                            <a th:each="categoryItem : ${categoryFinder.listAll()}" th:href="@{${categoryItem.status.permalink}}" th:id="${categoryItem.spec.displayName}">
                                <card th:data-image="${categoryItem.spec.cover}">
                                    <h2 slot="header">[[${categoryItem.spec.displayName}]]</h2>
                                    <p slot="content">[[${categoryItem.spec.description}]]</p>
                                </card>
                            </a>
                        </div>
                    </div>
                    <div>
                        <script data-pjax th:src="${assets_link + '/libs/vue/vue.min.js'}"></script>
                        <script data-pjax th:src="${assets_link + '/libs/no3d/no3d.min.js'}"></script>
                    </div>
                </th:block>
            </div>
        </main>
        <!-- 底部 -->
        <footer th:replace="~{modules/footer}"/>
    </div>

</th:block>

</html>
